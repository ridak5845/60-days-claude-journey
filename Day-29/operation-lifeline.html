<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base: #070B18;
    --bg-panel: #0D1220;
    --bg-card: #111827;
    --bg-card-hover: #1a2236;
    --border: #1E2D4A;
    --border-glow: #2D8EFF40;
    --blue: #2D8EFF;
    --blue-dim: #1a5fcc;
    --blue-glow: #2D8EFF30;
    --amber: #F59E0B;
    --amber-dim: #B45309;
    --red: #EF4444;
    --red-dim: #991B1B;
    --green: #10B981;
    --green-dim: #065F46;
    --purple: #8B5CF6;
    --cyan: #06B6D4;
    --text-primary: #F1F5F9;
    --text-secondary: #94A3B8;
    --text-muted: #4B5563;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --shadow-glow: 0 0 40px rgba(45,142,255,0.12);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  #root { min-height: 100vh; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── LAYOUT ── */
  .app-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ── HEADER BAR ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .top-bar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--blue);
    letter-spacing: 0.02em;
  }
  .pulse-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(239,68,68,0.6);
    animation: pulse-ring 1.5s infinite;
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
    70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  .top-bar-step {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── PROGRESS STEPPER ── */
  .stepper {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 28px 0 32px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
  }
  .step-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    border: 2px solid var(--border);
    color: var(--text-muted);
    background: var(--bg-card);
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .step-circle.active { border-color: var(--blue); color: var(--blue); background: var(--blue-glow); box-shadow: 0 0 14px var(--blue-glow); }
  .step-circle.done { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.12); }
  .step-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    text-align: center;
    white-space: nowrap;
  }
  .step-label.active { color: var(--blue); }
  .step-label.done { color: var(--green); }
  .step-connector {
    width: 28px; height: 2px;
    background: var(--border);
    flex-shrink: 0;
  }
  .step-connector.done { background: var(--green); }
  .step-wrap { display: flex; flex-direction: column; align-items: center; }

  /* ── CARDS ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: all 0.25s;
  }
  .card:hover { border-color: var(--border-glow); box-shadow: var(--shadow-glow); }
  .card-grid { display: grid; gap: 16px; }
  .card-grid-2 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card-grid-3 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

  /* ── SECTION HEADING ── */
  .section-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .section-title {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .section-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 620px;
    margin-bottom: 28px;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    box-shadow: 0 4px 16px rgba(45,142,255,0.3);
  }
  .btn-primary:hover { background: #4BA3FF; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(45,142,255,0.4); }
  .btn-secondary {
    background: transparent;
    color: var(--blue);
    border: 1px solid var(--blue);
  }
  .btn-secondary:hover { background: var(--blue-glow); }
  .btn-danger {
    background: rgba(239,68,68,0.12);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
  }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }
  .btn-success {
    background: var(--green);
    color: #fff;
    box-shadow: 0 4px 16px rgba(16,185,129,0.25);
  }
  .btn-success:hover { background: #34D399; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .btn-lg { padding: 16px 36px; font-size: 16px; border-radius: 10px; }

  /* ── ACTION CARD (selectable) ── */
  .action-card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .action-card:hover { border-color: var(--blue); box-shadow: 0 0 20px var(--blue-glow); transform: translateY(-2px); }
  .action-card.selected { border-color: var(--blue); background: rgba(45,142,255,0.08); box-shadow: 0 0 24px var(--blue-glow); }
  .action-card.disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .action-card .check-badge {
    position: absolute; top: 14px; right: 14px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    opacity: 0; transition: opacity 0.2s;
  }
  .action-card.selected .check-badge { opacity: 1; }

  /* ── PROGRESS BAR ── */
  .progress-wrap { margin-bottom: 16px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .progress-track {
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── METRIC CARDS ── */
  .metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .metric-value { font-size: 28px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .metric-delta { font-size: 12px; font-weight: 600; }
  .metric-delta.up { color: var(--green); }
  .metric-delta.down { color: var(--red); }

  /* ── CRISIS BANNER ── */
  .crisis-banner {
    background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(245,158,11,0.08));
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: var(--radius);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .crisis-banner::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 2px solid rgba(239,68,68,0.15);
    animation: threat-pulse 3s ease-in-out infinite;
  }
  .crisis-banner::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 2px solid rgba(239,68,68,0.25);
    animation: threat-pulse 3s ease-in-out infinite 0.5s;
  }
  @keyframes threat-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.5; }
  }
  .crisis-type-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.4);
    color: var(--red);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .urgency-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.4);
    color: var(--amber);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 8px;
  }

  /* ── TAG / BADGE ── */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .tag-blue { background: rgba(45,142,255,0.12); color: var(--blue); border: 1px solid rgba(45,142,255,0.25); }
  .tag-green { background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
  .tag-amber { background: rgba(245,158,11,0.12); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
  .tag-red { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
  .tag-purple { background: rgba(139,92,246,0.12); color: var(--purple); border: 1px solid rgba(139,92,246,0.25); }

  /* ── NEGOTIATION ── */
  .neg-option {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
    position: relative;
  }
  .neg-option:hover { border-color: var(--blue); background: var(--bg-card-hover); transform: translateX(4px); }
  .neg-option:last-child { margin-bottom: 0; }
  .neg-option-letter {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--blue-glow);
    color: var(--blue);
    font-size: 12px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    margin-right: 10px;
    flex-shrink: 0;
  }

  /* ── CEO QUIZ ── */
  .quiz-option {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
    font-size: 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .quiz-option:hover { border-color: var(--blue); background: var(--bg-card-hover); }
  .quiz-option.correct { border-color: var(--green); background: rgba(16,185,129,0.08); }
  .quiz-option.wrong { border-color: var(--red); background: rgba(239,68,68,0.08); }
  .quiz-option.selected-correct { border-color: var(--green); background: rgba(16,185,129,0.12); }
  .quiz-option.selected-wrong { border-color: var(--red); background: rgba(239,68,68,0.12); }

  /* ── AI CARDS ── */
  .ai-card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }
  .ai-card:hover { border-color: var(--purple); box-shadow: 0 0 20px rgba(139,92,246,0.15); transform: translateY(-2px); }
  .ai-card.selected { border-color: var(--purple); background: rgba(139,92,246,0.08); box-shadow: 0 0 24px rgba(139,92,246,0.15); }
  .ai-icon { font-size: 28px; margin-bottom: 10px; display: block; }

  /* ── FINAL SCORE ── */
  .score-ring-wrap {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }
  .score-ring {
    position: relative;
    width: 140px; height: 140px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .score-ring-number {
    font-size: 38px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    display: block;
    line-height: 1;
  }
  .score-ring-text { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── FEEDBACK CALLOUT ── */
  .callout {
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 12px;
    font-size: 14px;
    border-left: 4px solid;
    line-height: 1.6;
  }
  .callout-blue { background: rgba(45,142,255,0.08); border-color: var(--blue); }
  .callout-green { background: rgba(16,185,129,0.08); border-color: var(--green); }
  .callout-amber { background: rgba(245,158,11,0.08); border-color: var(--amber); }
  .callout-red { background: rgba(239,68,68,0.08); border-color: var(--red); }

  /* ── DIVIDER ── */
  .divider { height: 1px; background: var(--border); margin: 28px 0; }

  /* ── WELCOME ── */
  .welcome-hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(45,142,255,0.08) 0%, transparent 70%);
  }
  .welcome-logo {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1E3A5F, #0D1220);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin-bottom: 28px;
    box-shadow: 0 0 40px var(--blue-glow);
  }
  .welcome-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #F1F5F9, #94A3B8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome-subtitle {
    font-size: 18px;
    color: var(--blue);
    font-weight: 600;
    margin-bottom: 16px;
  }
  .welcome-desc {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 540px;
    line-height: 1.7;
    margin-bottom: 36px;
  }
  .welcome-features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .welcome-feature {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .welcome-feature span:first-child { font-size: 14px; }

  /* ── UTILITY ── */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .gap-16 { gap: 16px; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mb-4 { margin-bottom: 4px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; }
  .text-muted { color: var(--text-secondary); }
  .text-blue { color: var(--blue); }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }
  .text-amber { color: var(--amber); }
  .text-purple { color: var(--purple); }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .font-bold { font-weight: 700; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }

  /* ── FADE-IN ANIMATION ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.5s ease forwards; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .card-grid-2, .card-grid-3 { grid-template-columns: 1fr; }
    .stepper { gap: 0; }
    .step-connector { width: 16px; }
    .app-wrap { padding: 16px 14px 60px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── DATA GENERATORS ───────────────────────────────────────────────────────

const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

const INDUSTRIES = [
  { name: "Aerospace Components", emoji: "✈️" },
  { name: "Pharmaceutical Manufacturing", emoji: "💊" },
  { name: "Consumer Electronics", emoji: "📱" },
  { name: "Automotive Parts", emoji: "🚗" },
  { name: "Food & Beverage Processing", emoji: "🥤" },
  { name: "Medical Devices", emoji: "🏥" },
  { name: "Renewable Energy Equipment", emoji: "⚡" },
  { name: "Semiconductor Fabrication", emoji: "🔬" },
];

const COMPANY_NAMES = [
  "Nexum Industries","Vantara Global","Orion Supply Co","Apex Logistics","Meridian Manufacturing",
  "Stratos Corp","Pinnacle Systems","Crestline Holdings","Veriax Group","Solara Enterprises"
];

const COUNTRIES = ["USA","Germany","China","Japan","India","Brazil","Mexico","South Korea","Taiwan","Malaysia","Vietnam","Poland"];
const RISK_LEVELS = ["Low","Medium","High","Critical"];

function generateCompany() {
  const industry = pick(INDUSTRIES);
  const numFactories = rand(2, 6);
  const numWarehouses = rand(3, 9);
  const numSuppliers = rand(8, 25);
  const countries = shuffle(COUNTRIES).slice(0, rand(3, 6));
  return {
    name: pick(COMPANY_NAMES),
    industry: industry.name,
    emoji: industry.emoji,
    revenue: `$${rand(200, 950)}M`,
    employees: `${rand(1200, 8500).toLocaleString()}`,
    factories: numFactories,
    warehouses: numWarehouses,
    suppliers: numSuppliers,
    inventoryDays: rand(14, 45),
    leadTime: rand(7, 28),
    countries,
    supplyChainRisk: pick(RISK_LEVELS),
    annualGrowth: `${rand(3, 18)}%`,
    fillRate: `${rand(88, 99)}%`,
  };
}

const CRISES = [
  {
    type: "Factory Fire",
    emoji: "🔥",
    urgency: "CRITICAL",
    description: "A major fire has destroyed the primary production facility, halting {pct}% of manufacturing output.",
    impact: "Production capacity drops immediately. Insurance claims take months. Customers are already calling.",
    whyItMatters: "Factory fires are among the most devastating supply chain disruptions — rebuilding can take 12–18 months and cost tens of millions.",
  },
  {
    type: "Supplier Bankruptcy",

// ─── SCORE HELPERS ────────────────────────────────────────────────────────────

function clamp(v, lo = 0, hi = 100) { return Math.max(lo, Math.min(hi, v)); }

function getScoreColor(s) {
  if (s >= 80) return "var(--green)";
  if (s >= 60) return "var(--blue)";
  if (s >= 40) return "var(--amber)";
  return "var(--red)";
}

function getScoreLabel(s) {
  if (s >= 85) return "Elite Operator";
  if (s >= 70) return "Resilient Leader";
  if (s >= 55) return "Competent Manager";
  if (s >= 40) return "Developing";
  return "At Risk";
}

function ProgressBar({ label, value, color, showValue = true }) {
  const [width, setWidth] = useState(0);
  useEffect(() => { const t = setTimeout(() => setWidth(value), 120); return () => clearTimeout(t); }, [value]);
  const col = color || (value >= 70 ? "var(--green)" : value >= 40 ? "var(--amber)" : "var(--red)");
  return (
    <div className="progress-wrap">
      <div className="progress-label">
        <span>{label}</span>
        {showValue && <span className="font-mono" style={{ color: col }}>{Math.round(value)}</span>}
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: `${width}%`, background: col }} />
      </div>
    </div>
  );
}

function ScoreRing({ score, color }) {
  const r = 54; const circ = 2 * Math.PI * r;
  const [offset, setOffset] = useState(circ);
  useEffect(() => { const t = setTimeout(() => setOffset(circ - (score / 100) * circ), 300); return () => clearTimeout(t); }, [score]);
  const col = color || getScoreColor(score);
  return (
    <div className="score-ring-wrap">
      <div className="score-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="12"/>
          <circle cx="70" cy="70" r={r} fill="none" stroke={col} strokeWidth="12"
            strokeDasharray={circ} strokeDashoffset={offset}
            strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)" }}
          />
        </svg>
        <div className="score-ring-label">
          <span className="score-ring-number" style={{ color: col }}>{Math.round(score)}</span>
          <span className="score-ring-text">/ 100</span>
        </div>
      </div>
    </div>
  );
}

const STEPS = ["Company", "Crisis", "War Room", "Negotiate", "CEO", "AI Strategy", "Results"];

function Stepper({ current }) {
  return (
    <div className="stepper">
      {STEPS.map((s, i) => {
        const status = i < current ? "done" : i === current ? "active" : "";
        return (
          <div key={s} className="step-item">
            <div className="step-wrap">
              <div className={`step-circle ${status}`}>{i < current ? "✓" : i + 1}</div>
              <div className={`step-label ${status}`}>{s}</div>
            </div>
            {i < STEPS.length - 1 && <div className={`step-connector ${i < current ? "done" : ""}`} style={{ marginBottom: "16px" }} />}
          </div>
        );
      })}
    </div>
  );
}

function TopBar({ step }) {
  return (
    <div className="top-bar">
      <div className="top-bar-brand">
        <div className="pulse-dot" />
        Operation Lifeline
      </div>
      {step >= 0 && <div className="top-bar-step">Phase {step + 1} / {STEPS.length} — {STEPS[step]}</div>}
    </div>
  );
}

function WarRoomScreen({ onNext }) {
  const [selected, setSelected] = useState([]);
  const [revealed, setRevealed] = useState(false);
  const [metrics, setMetrics] = useState({ cost: 70, inventory: 60, profit: 65, delivery: 55, satisfaction: 72 });
  const actions = useRef(shuffle(ACTIONS)).current;

  const toggle = (id) => {
    if (revealed) return;
    if (selected.includes(id)) { setSelected(s => s.filter(x => x !== id)); return; }
    if (selected.length >= 3) return;
    setSelected(s => [...s, id]);
  };

  const simulate = () => {
    const chosen = actions.filter(a => selected.includes(a.id));
    let m = { ...metrics };
    chosen.forEach(a => {
      m.cost = clamp(m.cost + a.effects.cost);
      m.inventory = clamp(m.inventory + a.effects.inventory);
      m.profit = clamp(m.profit + a.effects.profit);
      m.delivery = clamp(m.delivery + a.effects.delivery);
      m.satisfaction = clamp(m.satisfaction + a.effects.satisfaction);
    });
    setMetrics(m);
    setRevealed(true);
  };

  const metricColor = (k, v) => {
    if (k === "cost") return v >= 60 ? "var(--green)" : v >= 40 ? "var(--amber)" : "var(--red)";
    return v >= 65 ? "var(--green)" : v >= 45 ? "var(--amber)" : "var(--red)";
  };

  return (
    <>
      <TopBar step={2} />
      <div className="app-wrap fade-up">
        <Stepper current={2} />
        <div className="section-eyebrow">War Room</div>
        <div className="section-title">Choose Your Response Strategy</div>
        <div className="section-subtitle">
          You have 6 possible actions but can only execute 3. Your team, time, and budget are limited. Each action has a different trade-off. Read the "Why it matters" note for each — then choose wisely.
        </div>

        <div className="callout callout-blue mb-24">
          <strong>How to choose:</strong> There's no single right answer. Think about what you're most at risk of losing first — customer trust, inventory, cost, or delivery performance — and protect that first.
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(310px,1fr))", gap: 14, marginBottom: 24 }}>
          {actions.map(a => {
            const isSel = selected.includes(a.id);
            const isDisabled = !isSel && selected.length >= 3 && !revealed;
            return (
              <div key={a.id}
                className={`action-card ${isSel ? "selected" : ""} ${isDisabled ? "disabled" : ""}`}
                onClick={() => toggle(a.id)}
              >
                <div className="check-badge">✓</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <span style={{ fontSize: 22 }}>{a.emoji}</span>
                  <span style={{ fontWeight: 700, fontSize: 14 }}>{a.title}</span>
                  <span className="tag tag-blue" style={{ marginLeft: "auto" }}>{a.tag}</span>
                </div>
                <div className="text-sm text-muted mb-8">{a.desc}</div>
                <div style={{ fontSize: 12, color: "var(--amber)", marginTop: 6, lineHeight: 1.5 }}>
                  💡 {a.why}
                </div>
                {!revealed && (
                  <div style={{ display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" }}>
                    {Object.entries(a.effects).map(([k, v]) => (
                      <span key={k} className={`tag ${v > 0 ? "tag-green" : "tag-red"}`} style={{ fontSize: 10 }}>
                        {k} {v > 0 ? `+${v}` : v}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 24, flexWrap: "wrap" }}>
          <div className="text-sm text-muted">Selected: <strong style={{ color: "var(--text-primary)" }}>{selected.length} / 3</strong></div>
          <button className="btn btn-primary" onClick={simulate} disabled={selected.length < 3 || revealed}>

        </div>

        {revealed && (
          <div className="card fade-up">
            <div className="section-eyebrow mb-12">Business Impact Simulation</div>
            <ProgressBar label="💰 Cost Efficiency" value={metrics.cost} color={metricColor("cost", metrics.cost)} />
            <ProgressBar label="📦 Inventory Health" value={metrics.inventory} color={metricColor("inventory", metrics.inventory)} />
            <ProgressBar label="📈 Profit Margin" value={metrics.profit} color={metricColor("profit", metrics.profit)} />
            <ProgressBar label="🚚 Delivery Speed" value={metrics.delivery} color={metricColor("delivery", metrics.delivery)} />
            <ProgressBar label="😊 Customer Satisfaction" value={metrics.satisfaction} color={metricColor("satisfaction", metrics.satisfaction)} />

function NegotiationScreen({ onNext }) {

  const choose = (opt) => {
    if (chosen !== null) return;
    setChosen(opt);
    const ns = {
      trust: clamp(scores.trust + opt.effect.trust),
      price: clamp(scores.price + opt.effect.price),
      leadTime: clamp(scores.leadTime + opt.effect.leadTime),
    };
    setScores(ns);
    setHistory(h => [...h, { round: round.round, label: opt.label, text: opt.text }]);
    setTimeout(() => {
      if (roundIdx < NEG_ROUNDS.length - 1) { setRoundIdx(i => i + 1); setChosen(null); }
      else setDone(true);

                <div className="text-xs text-muted mb-4">{m.label}</div>
                <div className="font-mono" style={{ fontSize: 24, fontWeight: 800, color: scoreColor(m.label === "Lead Time Risk" ? 100 - m.val : m.val) }}>{m.val}</div>

              <div key={i}

function CEOScreen({ onNext }) {
  const [qIdx, setQIdx] = useState(0);

  const [done, setDone] = useState(false);

  const q = CEO_QUESTIONS[qIdx];

  const answer = (opt) => {
    if (picked !== null) return;
    setPicked(opt);
    setTimeout(() => {
      setResults(r => [...r, { q: q.q, correct: opt.correct, picked: opt.text, explanation: q.explanation }]);
      if (qIdx < CEO_QUESTIONS.length - 1) { setQIdx(i => i + 1); setPicked(null); }
      else setDone(true);
    }, 1400);
  };

  const ceoScore = Math.round((score / CEO_QUESTIONS.length) * 100);

  return (
    <>
      <TopBar step={4} />
      <div className="app-wrap fade-up">
        <Stepper current={4} />
        <div className="section-eyebrow">CEO Boardroom</div>
        <div className="section-title">Executive Decision-Making</div>
        <div className="section-subtitle">
          You're in the boardroom. Five critical leadership questions — the kind that define careers. There's a best answer, but it requires thinking like a seasoned executive, not just a manager.

              <span className="tag tag-green">Score: {score} correct</span>
            </div>
            <div className="callout callout-amber mb-16">
              <strong>Why this question?</strong> {q.why}

              return (
                <div key={i} className={cls} onClick={() => answer(opt)}
                  style={{ cursor: picked !== null ? "default" : "pointer" }}>
                  <span style={{ fontWeight: 700, color: "var(--text-muted)", fontSize: 12, marginTop: 1 }}>{String.fromCharCode(65 + i)}.</span>
                  <span style={{ fontSize: 14 }}>{opt.text}</span>
                  {picked !== null && opt.correct && <span style={{ marginLeft: "auto", fontSize: 16 }}>✅</span>}
                  {picked !== null && opt === picked && !opt.correct && <span style={{ marginLeft: "auto", fontSize: 16 }}>❌</span>}
                </div>
              );
            })}
            {picked !== null && (
              <div className={`callout ${picked.correct ? "callout-green" : "callout-red"} mt-16 fade-up`}>
                <strong>{picked.correct ? "✅ Correct!" : "❌ Not quite."}</strong> {q.explanation}

        ) : (
          <div className="card fade-up">
            <div className="section-eyebrow mb-12">Boardroom Results</div>
            <ScoreRing score={ceoScore} />
            <div className="text-center mb-16">
              <div style={{ fontSize: 18, fontWeight: 700 }}>{getScoreLabel(ceoScore)}</div>
              <div className="text-muted text-sm">{score} of {CEO_QUESTIONS.length} executive decisions correct</div>
            </div>
            {results.map((r, i) => (
              <div key={i} className={`callout ${r.correct ? "callout-green" : "callout-red"} mb-8`}>

function ResultsScreen({ company, crisis, warResult, negResult, ceoResult, aiResult, onReplay }) {
  const { metrics, chosen: warChosen } = warResult;
  const { negScore } = negResult;
  const { ceoScore } = ceoResult;
  const { aiChosen } = aiResult;

  const resilience = clamp(Math.round((metrics.inventory + metrics.delivery) / 2 + (negScore >= 70 ? 10 : 0)));
  const costControl = clamp(metrics.cost + (ceoScore >= 80 ? 5 : 0));
  const riskMgmt = clamp(Math.round((negScore * 0.4 + ceoScore * 0.4 + (aiChosen.length * 10)) ));
  const custSat = clamp(metrics.satisfaction + (negScore >= 65 ? 5 : 0));
  const leadership = clamp(ceoScore + (negScore >= 60 ? 8 : 0));
  const negotiation = negScore;

  const overall = clamp(Math.round(
    resilience * 0.18 + costControl * 0.15 + riskMgmt * 0.18 + custSat * 0.18 + leadership * 0.16 + negotiation * 0.15
  ));

  const allActions = ACTIONS;
  const chosenActions = allActions.filter(a => warChosen.includes(a.id));

  const biggestMistake = (() => {
    if (metrics.cost < 45) return "High-cost decisions drained your margin without enough upside on delivery or satisfaction.";
    if (metrics.satisfaction < 50) return "Customer satisfaction took a major hit — you prioritized internal metrics over relationship preservation.";
    if (negotiation < 45) return "The supplier negotiation damaged trust early, limiting your flexibility in later rounds.";
    if (ceoScore < 40) return "Executive decisions missed key leadership best practices — particularly around communication and governance.";
    return "No single catastrophic mistake — your biggest opportunity was being more aggressive on customer satisfaction recovery.";
  })();

  const bestDecision = (() => {
    if (metrics.satisfaction >= 75) return "Prioritizing customer communication and satisfaction — this is what separates resilient brands from fragile ones.";
    if (negotiation >= 75) return "Building supplier trust early in negotiation — that goodwill will pay dividends in future disruptions.";
    if (ceoScore >= 80) return "Your executive judgment was sharp — board management, communications, and team care were all on point.";
    if (resilience >= 70) return "Maintaining inventory and delivery performance through the crisis — your customers felt it the least.";
    return "Activating a multi-front response rather than relying on a single action to solve everything.";
  })();

  const recommendation = (() => {
    const low = [resilience, costControl, riskMgmt, custSat].indexOf(Math.min(resilience, costControl, riskMgmt, custSat));

  })();

  const lessons = [
    "Supply chain resilience is built before the crisis, not during it — safety stock, dual sourcing, and risk monitoring are investments, not costs.",
    "Customer relationships survive disruptions when companies communicate early and honestly. Silence destroys trust faster than bad news.",
    "Supplier relationships are strategic assets. The negotiator who builds trust closes deals faster and gets priority access in crises.",
    "AI doesn't prevent disruptions — it compresses your reaction time from weeks to hours. Early warning is the #1 ROI in supply chain tech.",
    "Leadership in a crisis means protecting your people's capacity to perform, not just pushing harder.",
  ];

  return (
    <>
      <TopBar step={6} />
      <div className="app-wrap fade-up">
        <Stepper current={6} />
        <div className="section-eyebrow">Final Results</div>
        <div className="section-title">Crisis Debrief Dashboard</div>

          The crisis is over. Here's how {company.name} performed across every dimension of supply chain leadership. Use this to sharpen your judgment for next time.
        </div>

        <div className="card mb-24" style={{ textAlign: "center" }}>
          <div className="section-eyebrow">Overall Crisis Score</div>
          <ScoreRing score={overall} />
          <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 4, color: getScoreColor(overall) }}>{getScoreLabel(overall)}</div>
          <div className="text-muted text-sm">{company.name} navigating a {crisis.type}</div>
        </div>

        <div className="card mb-24">
          <div className="section-eyebrow mb-16">Performance Breakdown</div>
          <ProgressBar label="🧠 Leadership" value={leadership} />
          <ProgressBar label="🤝 Negotiation" value={negotiation} />
          <ProgressBar label="🛡️ Supply Chain Resilience" value={resilience} />

          <ProgressBar label="⚠️ Risk Management" value={riskMgmt} />
          <ProgressBar label="😊 Customer Satisfaction" value={custSat} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: 16, marginBottom: 24 }}>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 20 }}>
            <div className="metric-card">
              <div className="metric-label">War Room</div>
              <div className="metric-value" style={{ fontSize: 20, color: getScoreColor(metrics.satisfaction) }}>{chosenActions.length} actions</div>
              <div className="text-xs text-muted mt-4">{chosenActions.map(a => a.emoji).join(" ")}</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Negotiation</div>
              <div className="metric-value" style={{ fontSize: 20, color: getScoreColor(negScore) }}>{negScore}/100</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">CEO Score</div>
              <div className="metric-value" style={{ fontSize: 20, color: getScoreColor(ceoScore) }}>{ceoScore}/100</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">AI Investments</div>
              <div className="metric-value" style={{ fontSize: 20, color: "var(--purple)" }}>{aiChosen.map(a => a.emoji).join(" ")}</div>
              <div className="text-xs text-muted mt-4">{aiChosen.map(a => a.title.split(" ")[0]).join(", ")}</div>
            </div>
          </div>
        </div>

        <div className="card mb-32">
          <div className="section-eyebrow mb-16">Lessons Learned</div>
          {lessons.map((l, i) => (
            <div key={i} style={{ display: "flex", gap: 12, marginBottom: 14, alignItems: "flex-start" }}>
              <span className="font-mono" style={{ color: "var(--blue)", fontWeight: 700, fontSize: 12, paddingTop: 2, flexShrink: 0 }}>0{i+1}</span>
              <span className="text-sm" style={{ color: "var(--text-secondary)", lineHeight: 1.6 }}>{l}</span>
            </div>
          ))}
        </div>

        <div style={{ textAlign: "center" }}>
          <button className="btn btn-primary btn-lg" onClick={onReplay}>🔄 Play Again with New Scenario</button>
          <div className="text-xs text-muted mt-16">Each replay generates a new company, crisis, and outcome</div>
        </div>
      </div>
    </>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState("welcome");
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warResult, setWarResult] = useState(null);
  const [negResult, setNegResult] = useState(null);
  const [ceoResult, setCeoResult] = useState(null);
  const [aiResult, setAiResult] = useState(null);

  const start = () => {
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setScreen("company");
  };

  const replay = () => {
    setCompany(null); setCrisis(null); setWarResult(null);
    setNegResult(null); setCeoResult(null); setAiResult(null);
    setScreen("welcome");
  };

  if (screen === "welcome") return <WelcomeScreen onStart={start} />;
  if (screen === "company") return <CompanyScreen company={company} crisis={crisis} onNext={() => setScreen("crisis")} />;
  if (screen === "crisis") return <CrisisScreen company={company} crisis={crisis} onNext={() => setScreen("warroom")} />;
  if (screen === "warroom") return <WarRoomScreen onNext={(r) => { setWarResult(r); setScreen("negotiation"); }} />;
  if (screen === "negotiation") return <NegotiationScreen onNext={(r) => { setNegResult(r); setScreen("ceo"); }} />;
  if (screen === "ceo") return <CEOScreen onNext={(r) => { setCeoResult(r); setScreen("ai"); }} />;
  if (screen === "ai") return <AIScreen onNext={(r) => { setAiResult(r); setScreen("results"); }} />;
  if (screen === "results") return (
    <ResultsScreen
      company={company} crisis={crisis}
      warResult={warResult} negResult={negResult}
      ceoResult={ceoResult} aiResult={aiResult}
      onReplay={replay}
    />
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
