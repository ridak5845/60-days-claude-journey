<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defend Your Experience — Deloitte Data Analytics Job Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e15;
    --surface: #10151e;
    --surface-2: #151b26;
    --line: #232a37;
    --line-soft: #1a212c;
    --text: #eceef1;
    --text-dim: #9aa3b0;
    --text-faint: #5d6573;
    --red: #ec5f5f;
    --amber: #e3a544;
    --green: #4cce91;
    --blue: #6ea8fe;
    --purple: #b39ddb;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: var(--body);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    min-height: 100vh;
  }
  .dye-app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ===== Top bar ===== */
  .dye-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(10,14,21,0.92); backdrop-filter: blur(8px); z-index: 50;
  }
  .dye-brand { display: flex; align-items: center; gap: 10px; }
  .dye-brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dye-brand-name { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .dye-topbar-right { display: flex; align-items: center; gap: 14px; }
  .dye-pill {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-faint); border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px;
  }
  .dye-btn {
    font-family: var(--body); font-size: 12.5px; font-weight: 600; cursor: pointer;
    border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text-dim);
    transition: all .15s ease;
  }
  .dye-btn:hover { border-color: var(--text-faint); color: var(--text); }
  .dye-btn.primary { background: var(--green); color: #06130d; border-color: var(--green); }
  .dye-btn.primary:hover { filter: brightness(1.08); }
  .dye-btn.danger { color: var(--red); }
  .dye-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== Layout ===== */
  .dye-body { flex: 1; display: grid; grid-template-columns: 300px 1fr; }
  @media (max-width: 900px) { .dye-body { grid-template-columns: 1fr; } .dye-sidebar { display: none; } .dye-sidebar.mobile-open { display: block; } }

  .dye-sidebar {
    border-right: 1px solid var(--line); padding: 24px 20px; background: var(--surface);
    display: flex; flex-direction: column; gap: 26px; overflow-y: auto;
  }
  .dye-side-label {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); margin-bottom: 10px;
  }

  /* Progress ring */
  .dye-progress-wrap { display: flex; align-items: center; gap: 14px; }
  .dye-ring { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .dye-ring svg { transform: rotate(-90deg); }
  .dye-ring-track { fill: none; stroke: var(--line); stroke-width: 5; }
  .dye-ring-fill { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .5s ease, stroke .3s ease; }
  .dye-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .dye-progress-meta { font-size: 12px; color: var(--text-dim); }
  .dye-progress-meta b { color: var(--text); font-family: var(--mono); }

  /* Claims list */
  .dye-claims-list { display: flex; flex-direction: column; gap: 8px; }
  .dye-claim-chip {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--line-soft); font-size: 12px; color: var(--text-dim); cursor: default;
    transition: border-color .15s ease;
  }
  .dye-claim-chip.active { border-color: var(--blue); color: var(--text); background: var(--surface-2); }
  .dye-claim-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--text-faint); }
  .dye-claim-dot.strong { background: var(--green); }
  .dye-claim-dot.shaky { background: var(--amber); }
  .dye-claim-dot.weak { background: var(--red); }
  .dye-claim-dot.untested { background: var(--text-faint); }

  .dye-session-list { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
  .dye-session-item {
    font-size: 11.5px; color: var(--text-faint); padding: 7px 9px; border-radius: 6px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 6px; border: 1px solid transparent;
  }
  .dye-session-item:hover { border-color: var(--line); color: var(--text-dim); }

  /* ===== Main panel ===== */
  .dye-main { display: flex; flex-direction: column; min-height: 0; }

  /* Landing / empty state */
  .dye-landing { max-width: 640px; margin: 0 auto; padding: 60px 24px; text-align: center; }
  .dye-landing-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 14px; }
  .dye-landing h1 { font-family: var(--display); font-size: 30px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.02em; }
  .dye-landing p { color: var(--text-dim); font-size: 14.5px; max-width: 480px; margin: 0 auto 30px; }
  .dye-landing-card {
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 20px;
  }
  .dye-landing-card h3 { font-family: var(--display); font-size: 14px; margin: 0 0 10px; }
  .dye-landing-card ul { margin: 0; padding-left: 18px; color: var(--text-dim); font-size: 13px; }
  .dye-landing-card li { margin-bottom: 6px; }

  .dye-dropzone {
    border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px; margin-bottom: 18px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dye-dropzone:hover, .dye-dropzone.drag { border-color: var(--blue); background: var(--surface); }
  .dye-dropzone-icon { font-size: 22px; margin-bottom: 8px; }
  .dye-dropzone p { margin: 0; font-size: 12.5px; color: var(--text-faint); }
  .dye-dropzone input { display: none; }

  /* Chat / interview */
  .dye-thread { flex: 1; overflow-y: auto; padding: 26px 28px 12px; display: flex; flex-direction: column; gap: 18px; max-width: 760px; width: 100%; margin: 0 auto; }
  .dye-msg { display: flex; gap: 12px; max-width: 100%; }
  .dye-msg.user { flex-direction: row-reverse; }
  .dye-avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
  }
  .dye-avatar.ai { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #0a0e15; }
  .dye-avatar.user { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-dim); }
  .dye-bubble { padding: 13px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; max-width: 520px; }
  .dye-bubble.ai { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .dye-bubble.user { background: var(--surface-2); border: 1px solid var(--line-soft); border-top-right-radius: 4px; color: var(--text); }
  .dye-bubble .dye-tag-inline {
    display: inline-block; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--amber); border: 1px solid var(--amber); border-radius: 4px; padding: 1px 6px; margin-bottom: 8px;
  }
  .dye-bubble .dye-tag-inline.probe { color: var(--blue); border-color: var(--blue); }
  .dye-bubble .dye-tag-inline.pressure { color: var(--red); border-color: var(--red); }
  .dye-bubble .dye-tag-inline.followup { color: var(--purple); border-color: var(--purple); }

  .dye-typing { display: flex; gap: 4px; padding: 6px 2px; }
  .dye-typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); animation: dyeBlink 1.2s infinite ease-in-out; }
  .dye-typing span:nth-child(2) { animation-delay: .2s; }
  .dye-typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes dyeBlink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .dye-composer {
    border-top: 1px solid var(--line); padding: 16px 28px 22px; max-width: 760px; width: 100%; margin: 0 auto;
  }
  .dye-composer-row { display: flex; gap: 10px; align-items: flex-end; }
  .dye-composer textarea {
    flex: 1; resize: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; color: var(--text); font-family: var(--body); font-size: 13.5px; min-height: 46px; max-height: 160px;
  }
  .dye-composer textarea:focus { outline: none; border-color: var(--blue); }
  .dye-send-btn {
    width: 44px; height: 44px; border-radius: 10px; border: none; background: var(--green); color: #06130d;
    font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .dye-send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .dye-composer-hint { font-size: 10.5px; color: var(--text-faint); margin-top: 8px; font-family: var(--mono); }

  .dye-error-banner {
    max-width: 760px; margin: 0 auto 12px; background: rgba(236,95,95,.08); border: 1px solid var(--red);
    color: var(--red); font-size: 12.5px; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }

  /* ===== Report ===== */
  .dye-report { max-width: 820px; margin: 0 auto; padding: 32px 28px 60px; }
  .dye-report-header { text-align: center; margin-bottom: 32px; }
  .dye-report-header .dye-landing-eyebrow { color: var(--green); }
  .dye-report-header h1 { font-family: var(--display); font-size: 26px; margin: 8px 0 6px; }
  .dye-score-hero { display: flex; justify-content: center; gap: 40px; margin: 26px 0 8px; flex-wrap: wrap; }
  .dye-score-block { text-align: center; }
  .dye-score-block .num { font-family: var(--mono); font-size: 34px; font-weight: 600; }
  .dye-score-block .lbl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); margin-top: 4px; }

  .dye-report-section { margin-bottom: 28px; }
  .dye-report-section h2 {
    font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin: 0 0 14px;
  }
  .dye-claim-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; background: var(--surface); }
  .dye-claim-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .dye-claim-card-head .name { font-family: var(--display); font-weight: 600; font-size: 13.5px; }
  .dye-verdict { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 9px; border-radius: 20px; }
  .dye-verdict.strong { color: var(--green); border: 1px solid var(--green); }
  .dye-verdict.shaky { color: var(--amber); border: 1px solid var(--amber); }
  .dye-verdict.weak { color: var(--red); border: 1px solid var(--red); }
  .dye-claim-card p { margin: 0 0 6px; font-size: 12.5px; color: var(--text-dim); }
  .dye-claim-card .fix { color: var(--text); font-size: 12.5px; border-left: 2px solid var(--blue); padding-left: 10px; margin-top: 8px; }

  .dye-report-actions { display: flex; gap: 10px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }

  /* Confidence meter mini bars */
  .dye-mini-bar-track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 6px 0 2px; }
  .dye-mini-bar-fill { height: 100%; border-radius: 3px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .dye-fade-in { animation: dyeFadeIn .35s ease; }
  @keyframes dyeFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="dye-app" id="dyeApp">

  <div class="dye-topbar">
    <div class="dye-brand">
      <div class="dye-brand-dot"></div>
      <div class="dye-brand-name">Defend Your Experience</div>
    </div>
    <div class="dye-topbar-right">
      <span class="dye-pill" id="dyePhasePill">Setup</span>
      <button class="dye-btn" id="dyeExportBtn" style="display:none;">Export</button>
      <button class="dye-btn danger" id="dyeResetBtn">Reset</button>
    </div>
  </div>

  <div class="dye-body">
    <div class="dye-sidebar" id="dyeSidebar">
      <div>
        <div class="dye-side-label">Session Progress</div>
        <div class="dye-progress-wrap">
          <div class="dye-ring">
            <svg width="62" height="62" viewBox="0 0 62 62">
              <circle class="dye-ring-track" cx="31" cy="31" r="26"></circle>
              <circle class="dye-ring-fill" id="dyeRingFill" cx="31" cy="31" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"></circle>
            </svg>
            <div class="dye-ring-num" id="dyeRingNum">0%</div>
          </div>
          <div class="dye-progress-meta">Rounds: <b id="dyeRoundCount">0</b><br>Claims tested: <b id="dyeClaimsTestedCount">0</b>/<span id="dyeClaimsTotalCount">6</span></div>
        </div>
      </div>

      <div>
        <div class="dye-side-label">Claims Being Defended</div>
        <div class="dye-claims-list" id="dyeClaimsList"></div>
      </div>

      <div>
        <div class="dye-side-label">Session History</div>
        <div class="dye-session-list" id="dyeSessionList">
          <div style="font-size:11.5px; color:var(--text-faint);">No past sessions yet</div>
        </div>
      </div>
    </div>

    <div class="dye-main" id="dyeMain">
      <!-- populated by JS: landing, thread+composer, or report -->
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ===================== State =====================
  const STORAGE_KEY = "dye_sessions_v1";
  const state = {
    phase: "landing", // landing -> interview -> report
    claims: [],        // {id, text, status: untested|strong|shaky|weak, notes}
    messages: [],       // {role, content, tag}
    round: 0,
    maxRounds: 10,
    sourceSummary: "",
    audience: "Mixed panel interview",
    projectLabel: "Deloitte Data Analytics Job Simulation (Forage)",
    lastError: null,
    isTyping: false,
    sessionId: null
  };

  const DEFAULT_CLAIMS = [
    { id: "c1", text: "Analyzed client sales/audit data to find risk patterns", status: "untested", notes: "" },
    { id: "c2", text: "Built a dashboard/visualization to surface findings", status: "untested", notes: "" },
    { id: "c3", text: "Used Excel / Tableau for exploratory analysis", status: "untested", notes: "" },
    { id: "c4", text: "Identified anomalies or high-risk transactions", status: "untested", notes: "" },
    { id: "c5", text: "Wrote a memo/summary of findings for an audit partner", status: "untested", notes: "" },
    { id: "c6", text: "Simulation reflects real analyst judgment, not just following steps", status: "untested", notes: "" }
  ];

  const SEED_CONTEXT = `Deloitte Data Analytics Job Simulation on Forage. Typical structure: candidate plays the role of a
technology consulting analyst supporting an audit/advisory engagement. Tasks usually include: (1) creating a data
dashboard from a provided dataset to help partners understand a client's business and flag risk areas, (2) analyzing
the data (often in Excel or Tableau) to identify unusual patterns, outliers, or risk indicators in transactions,
(3) writing a short professional memo or email to a senior/partner summarizing findings and recommending next steps,
(4) reasoning about data quality issues and what conclusions can/can't be drawn from limited data. The simulation is
self-paced, unassessed by a real Deloitte employee (asynchronous, template-guided), and does not involve real client
data or real stakeholders reacting to the candidate's work.`;

  // ===================== Persistence =====================
  function loadSessions() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { return []; }
  }
  function saveSessions(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function persistCurrentSession() {
    if (!state.sessionId) return;
    const list = loadSessions().filter(s => s.id !== state.sessionId);
    list.unshift({
      id: state.sessionId,
      date: new Date().toISOString(),
      projectLabel: state.projectLabel,
      round: state.round,
      claims: state.claims,
      messages: state.messages,
      phase: state.phase
    });
    saveSessions(list.slice(0, 20));
    renderSessionList();
  }

  // ===================== Rendering: shell pieces =====================
  const mainEl = document.getElementById("dyeMain");
  const phasePill = document.getElementById("dyePhasePill");
  const exportBtn = document.getElementById("dyeExportBtn");
  const resetBtn = document.getElementById("dyeResetBtn");

  function setPhasePill(text) { phasePill.textContent = text; }

  function renderClaimsList() {
    const wrap = document.getElementById("dyeClaimsList");
    if (!wrap) return;
    wrap.innerHTML = "";
    state.claims.forEach(c => {
      const div = document.createElement("div");
      div.className = "dye-claim-chip" + (c.active ? " active" : "");
      div.innerHTML = `<span class="dye-claim-dot ${c.status}"></span><span>${escapeHtml(c.text)}</span>`;
      wrap.appendChild(div);
    });
    const tested = state.claims.filter(c => c.status !== "untested").length;
    document.getElementById("dyeClaimsTestedCount").textContent = tested;
    document.getElementById("dyeClaimsTotalCount").textContent = state.claims.length;
  }

  function renderProgressRing() {
    const pct = Math.min(100, Math.round((state.round / state.maxRounds) * 100));
    const circumference = 163.4;
    const offset = circumference - (circumference * pct / 100);
    const fill = document.getElementById("dyeRingFill");
    fill.style.strokeDashoffset = offset;
    fill.style.stroke = pct < 40 ? "#e3a544" : (pct < 80 ? "#6ea8fe" : "#4cce91");
    document.getElementById("dyeRingNum").textContent = pct + "%";
    document.getElementById("dyeRoundCount").textContent = state.round;
  }

  function renderSessionList() {
    const wrap = document.getElementById("dyeSessionList");
    const sessions = loadSessions();
    if (!sessions.length) {
      wrap.innerHTML = '<div style="font-size:11.5px; color:var(--text-faint);">No past sessions yet</div>';
      return;
    }
    wrap.innerHTML = "";
    sessions.forEach(s => {
      const div = document.createElement("div");
      div.className = "dye-session-item";
      const d = new Date(s.date);
      div.innerHTML = `<span>${escapeHtml(s.projectLabel).slice(0,26)}</span><span>${d.toLocaleDateString()}</span>`;
      div.onclick = () => loadSession(s.id);
      wrap.appendChild(div);
    });
  }

  function loadSession(id) {
    const s = loadSessions().find(x => x.id === id);
    if (!s) return;
    state.sessionId = s.id;
    state.claims = s.claims;
    state.messages = s.messages;
    state.round = s.round;
    state.phase = s.phase;
    if (state.phase === "report") renderReport();
    else renderInterview();
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  // ===================== Landing =====================
  function renderLanding() {
    state.phase = "landing";
    setPhasePill("Setup");
    exportBtn.style.display = "none";
    document.getElementById("dyeSidebar").style.opacity = "0.35";
    document.getElementById("dyeSidebar").style.pointerEvents = "none";

    mainEl.innerHTML = `
      <div class="dye-landing dye-fade-in">
        <div class="dye-landing-eyebrow">Mixed Panel Interview Prep</div>
        <h1>Defend your Deloitte Data Analytics Job Simulation</h1>
        <p>This isn't resume review. I'm going to interview you like a skeptical panel would — pressure-testing
        every claim about what you actually did, what you decided, and what you can prove — until your story
        holds up under real questioning.</p>

        <div class="dye-landing-card">
          <h3>What I'll challenge</h3>
          <ul>
            <li>Vague claims ("analyzed data") with no specifics on tools, scope, or decisions</li>
            <li>Simulation vs. reality — this was self-paced and unassessed by a real Deloitte team</li>
            <li>Whether you can explain <em>why</em> you made a call, not just that you made one</li>
            <li>Numbers, findings, or outcomes you can't back up on the spot</li>
          </ul>
        </div>

        <div class="dye-dropzone" id="dyeDropzone">
          <div class="dye-dropzone-icon">📎</div>
          <p><b>Optional:</b> drag & drop or click to attach your certificate, notes, or reflection write-up</p>
          <p style="margin-top:4px;">If you skip this, I'll work from what's typically covered in this simulation.</p>
          <input type="file" id="dyeFileInput" accept=".txt,.md,.pdf">
        </div>
        <div id="dyeUploadStatus" style="font-size:11.5px; color:var(--text-faint); margin-bottom:20px;"></div>

        <button class="dye-btn primary" id="dyeStartBtn" style="width:100%; padding:13px; font-size:13.5px;">Start the interview →</button>
      </div>
    `;

    const dz = document.getElementById("dyeDropzone");
    const fi = document.getElementById("dyeFileInput");
    const status = document.getElementById("dyeUploadStatus");
    dz.onclick = () => fi.click();
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
    dz.ondragleave = () => dz.classList.remove("drag");
    dz.ondrop = (e) => {
      e.preventDefault(); dz.classList.remove("drag");
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    };
    fi.onchange = () => { if (fi.files.length) handleFile(fi.files[0]); };

    function handleFile(file) {
      if (file.type && file.type.indexOf("text") === -1 && file.type !== "application/pdf") {
        status.textContent = "Couldn't read that file type — I'll proceed with the standard simulation context instead.";
        return;
      }
      status.textContent = "Reading " + file.name + "…";
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "").slice(0, 6000);
        state.sourceSummary = text;
        status.textContent = "Loaded " + file.name + " — I'll pull claims from this too.";
      };
      reader.onerror = () => { status.textContent = "Couldn't read that file — proceeding without it."; };
      if (file.type === "application/pdf") {
        status.textContent = "PDF attached — I'll reference it contextually (full parsing not available here).";
      } else {
        reader.readAsText(file);
      }
    }

    document.getElementById("dyeStartBtn").onclick = startInterview;
  }

  // ===================== Interview =====================
  function startInterview() {
    state.claims = JSON.parse(JSON.stringify(DEFAULT_CLAIMS));
    state.messages = [];
    state.round = 0;
    state.phase = "interview";
    state.sessionId = "sess_" + Date.now();
    document.getElementById("dyeSidebar").style.opacity = "1";
    document.getElementById("dyeSidebar").style.pointerEvents = "auto";
    setPhasePill("Round 1 · Live");
    renderInterview();
    // Kick off with an opening challenge
    requestNextAIMessage(true);
  }

  function renderInterview() {
    setPhasePill(state.round >= state.maxRounds ? "Ready for report" : `Round ${state.round + 1} · Live`);
    renderClaimsList();
    renderProgressRing();
    exportBtn.style.display = "none";

    mainEl.innerHTML = `
      <div id="dyeErrorSlot"></div>
      <div class="dye-thread" id="dyeThread"></div>
      <div class="dye-composer">
        <div class="dye-composer-row">
          <textarea id="dyeInput" placeholder="Answer honestly — I'll follow up on whatever's vague..." rows="1"></textarea>
          <button class="dye-send-btn" id="dyeSendBtn">↑</button>
        </div>
        <div class="dye-composer-hint">Enter to send · Shift+Enter for newline · Answers stay on this device</div>
        <div style="margin-top:12px; text-align:center;">
          <button class="dye-btn" id="dyeFinishBtn">Finish early & generate report</button>
        </div>
      </div>
    `;

    renderMessages();

    const input = document.getElementById("dyeInput");
    const sendBtn = document.getElementById("dyeSendBtn");
    input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(160, input.scrollHeight) + "px"; });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    sendBtn.onclick = handleSend;
    document.getElementById("dyeFinishBtn").onclick = () => {
      if (state.messages.filter(m => m.role === "user").length === 0) {
        alert("Answer at least one question first so I have something to evaluate.");
        return;
      }
      generateReport();
    };
  }

  function renderMessages() {
    const thread = document.getElementById("dyeThread");
    if (!thread) return;
    thread.innerHTML = "";
    state.messages.forEach(m => {
      const row = document.createElement("div");
      row.className = "dye-msg " + (m.role === "user" ? "user" : "ai") + " dye-fade-in";
      const tagHtml = m.tag ? `<div class="dye-tag-inline ${m.tag}">${labelForTag(m.tag)}</div>` : "";
      row.innerHTML = `
        <div class="dye-avatar ${m.role === "user" ? "user" : "ai"}">${m.role === "user" ? "You" : "AI"}</div>
        <div class="dye-bubble ${m.role === "user" ? "user" : "ai"}">${tagHtml}${escapeHtml(m.content).replace(/\n/g, "<br>")}</div>
      `;
      thread.appendChild(row);
    });
    if (state.isTyping) {
      const row = document.createElement("div");
      row.className = "dye-msg ai";
      row.innerHTML = `<div class="dye-avatar ai">AI</div><div class="dye-bubble ai"><div class="dye-typing"><span></span><span></span><span></span></div></div>`;
      thread.appendChild(row);
    }
    thread.scrollTop = thread.scrollHeight;
  }

  function labelForTag(tag) {
    return { probe: "Probing", pressure: "Pressure test", followup: "Follow-up" }[tag] || "Challenge";
  }

  function showError(msg, retryFn) {
    const slot = document.getElementById("dyeErrorSlot");
    if (!slot) return;
    slot.innerHTML = `
      <div class="dye-error-banner">
        <span>⚠ ${escapeHtml(msg)}</span>
        <button class="dye-btn" id="dyeRetryBtn" style="padding:5px 10px; font-size:11.5px;">Retry</button>
      </div>
    `;
    document.getElementById("dyeRetryBtn").onclick = () => { slot.innerHTML = ""; retryFn(); };
  }
  function clearError() {
    const slot = document.getElementById("dyeErrorSlot");
    if (slot) slot.innerHTML = "";
  }

  function handleSend() {
    const input = document.getElementById("dyeInput");
    const text = input.value.trim();
    if (!text || state.isTyping) return;
    state.messages.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";
    renderMessages();
    persistCurrentSession();
    requestNextAIMessage(false);
  }

  // ===================== Claude API integration =====================
  function buildSystemPrompt() {
    return `You are a sharp, skeptical mixed interview panel (hiring manager + technical interviewer + HR)
grilling a candidate about their Deloitte Data Analytics Job Simulation (via Forage). Your job is to pressure-test
every claim they make, the way a real panel would, and to get progressively more specific with each answer they give.

Simulation context (use this to ground realistic questions, and gently challenge overclaiming since this is
self-paced and asynchronous, not a real client engagement):
${SEED_CONTEXT}
${state.sourceSummary ? "\nAdditional candidate-provided material:\n" + state.sourceSummary : ""}

Claims currently being tracked (id: text: status):
${state.claims.map(c => `- ${c.id}: ${c.text} [${c.status}]`).join("\n")}

Rules:
- Ask ONE question at a time. Never ask multiple questions in one turn.
- Each question must build on the candidate's previous answer — reference specifics they said.
- Rotate through: probing for specifics ("probe"), pressuring on vague/unverifiable claims ("pressure"),
  and natural follow-ups digging deeper into something they just said ("followup").
- Call out vagueness directly but not cruelly — e.g. if they say "I analyzed the data," push for what tool,
  what specifically they looked at, what they found, why it mattered.
- If they cite a number or outcome, ask how they'd verify or explain it if pressed by a skeptical technical panelist.
- Periodically test whether they can distinguish what they genuinely decided vs. what the simulation template guided them to do.
- Keep questions to 1-3 sentences. No preamble like "Great answer!" — go straight to the next question, panel-style,
  though you can briefly (one short clause) acknowledge a genuinely strong specific answer before pivoting.
- Also output a hidden JSON evaluation block. Respond in this EXACT format, nothing else:

QUESTION_TAG: probe|pressure|followup
QUESTION: <your single question>
CLAIM_UPDATES: <JSON array like [{"id":"c1","status":"strong|shaky|weak","notes":"short note"}] — only include claims whose status you can now judge based on the conversation so far. Empty array [] if none yet.`;
  }

  function requestNextAIMessage(isOpening) {
    state.isTyping = true;
    renderMessages();
    clearError();

    const apiMessages = [];
    state.messages.forEach(m => {
      apiMessages.push({ role: m.role === "user" ? "user" : "assistant", content: m.content });
    });
    if (isOpening) {
      apiMessages.push({ role: "user", content: "Begin the panel interview with your first question." });
    }

    callClaude(buildSystemPrompt(), apiMessages)
      .then(parsed => {
        state.isTyping = false;
        applyClaimUpdates(parsed.claimUpdates);
        state.messages.push({ role: "assistant", content: parsed.question, tag: parsed.tag });
        state.round += 1;
        renderClaimsList();
        renderProgressRing();
        renderMessages();
        persistCurrentSession();
        setPhasePill(state.round >= state.maxRounds ? "Ready for report" : `Round ${state.round + 1} · Live`);
        if (state.round >= state.maxRounds) {
          const thread = document.getElementById("dyeThread");
          const note = document.createElement("div");
          note.style.cssText = "text-align:center; font-size:11.5px; color:var(--text-faint); font-family:var(--mono); margin-top:6px;";
          note.textContent = "You've covered a solid number of rounds — finish early to see your Defense Report, or keep going.";
          thread.appendChild(note);
        }
      })
      .catch(err => {
        state.isTyping = false;
        renderMessages();
        showError(errorMessageFor(err), () => requestNextAIMessage(isOpening));
      });
  }

  function applyClaimUpdates(updates) {
    if (!Array.isArray(updates)) return;
    updates.forEach(u => {
      const c = state.claims.find(x => x.id === u.id);
      if (c && u.status) {
        c.status = u.status;
        if (u.notes) c.notes = u.notes;
      }
    });
  }

  function errorMessageFor(err) {
    const msg = (err && err.message) || "";
    if (msg.indexOf("429") !== -1 || /rate/i.test(msg)) return "Rate limited for a moment — the panel needs a breath. Try again in a few seconds.";
    if (msg.indexOf("overloaded") !== -1 || msg.indexOf("529") !== -1) return "The model's overloaded right now. Retry in a moment.";
    return "Something went wrong reaching the model. Your answers are saved — retry when ready.";
  }

  async function callClaude(system, messages, maxTokens) {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: maxTokens || 1000,
        system: system,
        messages: messages
      })
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => "");
      throw new Error("HTTP " + response.status + " " + errText);
    }
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    return parseAIResponse(textBlocks);
  }

  function parseAIResponse(raw) {
    // Expected format: QUESTION_TAG: ...\nQUESTION: ...\nCLAIM_UPDATES: [...]
    let tag = "probe", question = raw.trim(), claimUpdates = [];
    try {
      const tagMatch = raw.match(/QUESTION_TAG:\s*(\w+)/i);
      const qMatch = raw.match(/QUESTION:\s*([\s\S]*?)(?:\nCLAIM_UPDATES:|$)/i);
      const cMatch = raw.match(/CLAIM_UPDATES:\s*(\[[\s\S]*\])/i);
      if (tagMatch) tag = tagMatch[1].toLowerCase();
      if (qMatch) question = qMatch[1].trim();
      if (cMatch) {
        try { claimUpdates = JSON.parse(cMatch[1]); } catch(e) { claimUpdates = []; }
      }
    } catch(e) {}
    if (!["probe","pressure","followup"].includes(tag)) tag = "probe";
    return { tag, question, claimUpdates };
  }

  // ===================== Report =====================
  function generateReport() {
    state.phase = "report";
    setPhasePill("Generating report…");
    mainEl.innerHTML = `
      <div class="dye-landing">
        <div class="dye-typing" style="justify-content:center; margin-top:60px;"><span></span><span></span><span></span></div>
        <p style="margin-top:16px;">Compiling your Defense Report…</p>
      </div>
    `;

    const system = `You are compiling a final "Defense Report" for a candidate after a mock panel interview about their
Deloitte Data Analytics Job Simulation. Base your evaluation ONLY on the actual conversation transcript provided.
Be honest and specific — do not be generically encouraging. Identify real gaps.

Claims tracked:
${state.claims.map(c => `- ${c.id}: ${c.text} [current status: ${c.status}]`).join("\n")}

Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:
{
  "overallConfidence": <integer 0-100>,
  "readiness": "<one short phrase e.g. 'Solid, minor gaps' / 'Needs targeted prep' / 'Not yet interview-ready'>",
  "summary": "<3-4 sentence honest overview of how they defended themselves overall>",
  "claims": [
    {"id": "c1", "verdict": "strong|shaky|weak", "evidence": "<what they said that supports this, 1-2 sentences>", "gap": "<the specific weakness, 1-2 sentences, or empty string if strong>", "fix": "<one concrete, specific thing to prepare before a real interview>"}
  ],
  "strongestMoment": "<1-2 sentences on their best, most specific answer during the session>",
  "biggestRisk": "<1-2 sentences on the single most dangerous gap if a real panel pushed harder>",
  "nextSteps": ["<specific action item>", "<specific action item>", "<specific action item>"]
}`;

    const transcript = state.messages.map(m => `${m.role === "user" ? "CANDIDATE" : "PANEL"}: ${m.content}`).join("\n\n");

    callClaudeRaw(system, [{ role: "user", content: "Here is the transcript:\n\n" + transcript }])
      .then(reportData => {
        renderReport(reportData);
        persistReportToSession(reportData);
      })
      .catch(err => {
        mainEl.innerHTML = `
          <div class="dye-landing">
            <div class="dye-error-banner" style="max-width:520px;">⚠ ${escapeHtml(errorMessageFor(err))}</div>
            <button class="dye-btn primary" id="dyeRetryReportBtn" style="margin-top:16px;">Retry report generation</button>
          </div>
        `;
        document.getElementById("dyeRetryReportBtn").onclick = generateReport;
      });
  }

  async function callClaudeRaw(system, messages) {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: system, messages: messages })
    });
    if (!response.ok) {
      const errText = await response.text().catch(() => "");
      throw new Error("HTTP " + response.status + " " + errText);
    }
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    const cleaned = textBlocks.replace(/```json|```/g, "").trim();
    return JSON.parse(cleaned);
  }

  let lastReportData = null;
  function persistReportToSession(reportData) {
    lastReportData = reportData;
    if (!state.sessionId) return;
    const list = loadSessions();
    const idx = list.findIndex(s => s.id === state.sessionId);
    if (idx !== -1) { list[idx].report = reportData; list[idx].phase = "report"; saveSessions(list); }
  }

  function renderReport(reportData) {
    state.phase = "report";
    setPhasePill("Defense Report");
    exportBtn.style.display = "inline-block";
    if (reportData) lastReportData = reportData;
    const r = lastReportData;
    if (!r) return;

    const verdictColor = { strong: "var(--green)", shaky: "var(--amber)", weak: "var(--red)" };

    mainEl.innerHTML = `
      <div class="dye-report dye-fade-in">
        <div class="dye-report-header">
          <div class="dye-landing-eyebrow">Defense Report</div>
          <h1>${escapeHtml(state.projectLabel)}</h1>
          <p style="color:var(--text-dim); font-size:13px;">${escapeHtml(r.readiness || "")}</p>
          <div class="dye-score-hero">
            <div class="dye-score-block">
              <div class="num" style="color:${r.overallConfidence >= 70 ? "var(--green)" : r.overallConfidence >= 45 ? "var(--amber)" : "var(--red)"}">${r.overallConfidence}%</div>
              <div class="lbl">Overall Confidence</div>
            </div>
            <div class="dye-score-block">
              <div class="num">${state.claims.filter(c => c.status === "strong").length}/${state.claims.length}</div>
              <div class="lbl">Claims Well Defended</div>
            </div>
            <div class="dye-score-block">
              <div class="num">${state.round}</div>
              <div class="lbl">Rounds Completed</div>
            </div>
          </div>
        </div>

        <div class="dye-report-section">
          <h2>Overall Read</h2>
          <p style="font-size:13.5px; color:var(--text); line-height:1.7;">${escapeHtml(r.summary || "")}</p>
        </div>

        <div class="dye-report-section">
          <h2>Claim-by-Claim Breakdown</h2>
          ${(r.claims || []).map(rc => {
            const claim = state.claims.find(c => c.id === rc.id);
            const label = claim ? claim.text : rc.id;
            return `
              <div class="dye-claim-card">
                <div class="dye-claim-card-head">
                  <div class="name">${escapeHtml(label)}</div>
                  <span class="dye-verdict ${rc.verdict}">${escapeHtml(rc.verdict)}</span>
                </div>
                <div class="dye-mini-bar-track"><div class="dye-mini-bar-fill" style="width:${rc.verdict === "strong" ? 90 : rc.verdict === "shaky" ? 55 : 25}%; background:${verdictColor[rc.verdict] || "var(--text-faint)"};"></div></div>
                <p><b style="color:var(--text-dim);">Evidence:</b> ${escapeHtml(rc.evidence || "—")}</p>
                ${rc.gap ? `<p><b style="color:var(--text-dim);">Gap:</b> ${escapeHtml(rc.gap)}</p>` : ""}
                <div class="fix">${escapeHtml(rc.fix || "")}</div>
              </div>
            `;
          }).join("")}
        </div>

        <div class="dye-report-section">
          <h2>Strongest Moment</h2>
          <p style="font-size:13px; color:var(--text-dim);">${escapeHtml(r.strongestMoment || "")}</p>
        </div>

        <div class="dye-report-section">
          <h2>Biggest Risk If Pushed Harder</h2>
          <p style="font-size:13px; color:var(--red);">${escapeHtml(r.biggestRisk || "")}</p>
        </div>

        <div class="dye-report-section">
          <h2>Before Your Real Interview</h2>
          <div class="dye-takeaway-list" style="display:flex; flex-direction:column; gap:10px;">
            ${(r.nextSteps || []).map(s => `<div style="display:flex; gap:10px; align-items:baseline; font-size:13px;"><span style="color:var(--blue);">→</span><span>${escapeHtml(s)}</span></div>`).join("")}
          </div>
        </div>

        <div class="dye-report-actions">
          <button class="dye-btn primary" id="dyeReplayBtn">Run another round on weak claims</button>
          <button class="dye-btn" id="dyeNewSessionBtn">Start a new session</button>
          <button class="dye-btn" id="dyeExportBtn2">Export report (.md)</button>
        </div>
      </div>
    `;

    document.getElementById("dyeReplayBtn").onclick = () => {
      state.phase = "interview";
      state.maxRounds = state.round + 4;
      renderInterview();
      state.messages.push({ role: "assistant", content: "Let's go back to the claims that were shaky or weak — I'm not letting those go yet.", tag: "pressure" });
      renderMessages();
      requestNextAIMessage(false);
    };
    document.getElementById("dyeNewSessionBtn").onclick = () => renderLanding();
    document.getElementById("dyeExportBtn2").onclick = () => exportMarkdown(r);
    exportBtn.onclick = () => exportMarkdown(r);
    renderClaimsList();
  }

  function exportMarkdown(r) {
    const lines = [];
    lines.push(`# Defense Report — ${state.projectLabel}`);
    lines.push(`\n**Overall Confidence:** ${r.overallConfidence}% — ${r.readiness}\n`);
    lines.push(`## Overall Read\n${r.summary}\n`);
    lines.push(`## Claim-by-Claim Breakdown\n`);
    (r.claims || []).forEach(rc => {
      const claim = state.claims.find(c => c.id === rc.id);
      lines.push(`### ${claim ? claim.text : rc.id} — ${rc.verdict.toUpperCase()}`);
      lines.push(`- Evidence: ${rc.evidence || "—"}`);
      if (rc.gap) lines.push(`- Gap: ${rc.gap}`);
      lines.push(`- Fix: ${rc.fix || "—"}\n`);
    });
    lines.push(`## Strongest Moment\n${r.strongestMoment}\n`);
    lines.push(`## Biggest Risk\n${r.biggestRisk}\n`);
    lines.push(`## Before Your Real Interview\n`);
    (r.nextSteps || []).forEach(s => lines.push(`- ${s}`));
    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "defense-report.md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ===================== Reset =====================
  resetBtn.onclick = () => {
    if (!confirm("Start over? This clears the current session (past sessions in history are kept).")) return;
    renderLanding();
  };

  // ===================== Init =====================
  renderSessionList();
  renderLanding();
})();
</script>
</body>
