<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prior Authorization Story Simulator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0e15',
          surface: '#11161f',
          surface2: '#161c27',
          line: '#232831',
          linesoft: '#1c212a',
          text: '#eceef1',
          textdim: '#9aa3b0',
          textfaint: '#5d6573',
          red: '#ec5f5f',
          amber: '#e3a544',
          green: '#4cce91',
          blue: '#6ea8fe',
          purple: '#b39ddb'
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        }
      }
    }
  };
</script>

<style>
  html, body { margin:0; padding:0; }
  body { font-family:'Inter', sans-serif; }

  @keyframes pssFadeUp { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .anim-in { animation: pssFadeUp .35s ease forwards; }

  @keyframes pssTypingBounce { 0%,80%,100%{ transform:scale(0.6); opacity:.35; } 40%{ transform:scale(1); opacity:1; } }
  .typing-dot { animation: pssTypingBounce 1.1s infinite ease-in-out; }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#232831; border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  *:focus-visible { outline:2px solid #6ea8fe; outline-offset:2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body class="bg-bg text-text min-h-screen">

  <div class="max-w-3xl mx-auto min-h-screen flex flex-col">

    <!-- Header -->
    <header class="px-5 pt-7 pb-4 border-b border-line">
      <p class="text-[10px] font-mono uppercase tracking-[0.12em] text-textfaint mb-2">Healthcare Education · Interactive Story</p>
      <h1 class="font-display text-xl sm:text-2xl font-bold text-text">Prior Authorization Story Simulator</h1>
      <p class="text-xs sm:text-sm text-textdim mt-1.5 max-w-xl">Follow Rahul and Priya through a Prior Authorization journey — from diagnosis to denial to approval — and make choices along the way.</p>

      <div class="mt-5">
        <div class="flex items-center justify-between mb-1.5">
          <span id="progressLabel" class="text-[10px] font-mono uppercase tracking-wide text-textfaint">Scene 0 of 8</span>
          <span id="progressPct" class="text-[10px] font-mono text-textfaint">0%</span>
        </div>
        <div class="h-1.5 w-full bg-linesoft rounded-full overflow-hidden">
          <div id="progressFill" class="h-full bg-blue rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </header>

    <!-- Chat feed: built ONLY via createElement + appendChild, never innerHTML -->
    <main id="chatFeed" class="flex-1 overflow-y-auto px-4 sm:px-5 py-6 space-y-4"></main>

  </div>

<script>
(function () {
  'use strict';

  /* =======================================================================
     DOM HELPERS — every node below is built with document.createElement
     and attached with appendChild. The chat feed's innerHTML is never
     assigned, at any point in this file.
     ======================================================================= */
  var feedEl = document.getElementById('chatFeed');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');
  var progressPct = document.getElementById('progressPct');

  function el(tag, classNames) {
    var node = document.createElement(tag);
    if (classNames) node.className = classNames;
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child === null || child === undefined) continue;
      if (typeof child === 'string') node.appendChild(document.createTextNode(child));
      else node.appendChild(child);
    }
    return node;
  }

  function appendParts(parent, parts) {
    parts.forEach(function (p) {
      if (p === null || p === undefined) return;
      if (typeof p === 'string') parent.appendChild(document.createTextNode(p));
      else parent.appendChild(p);
    });
    return parent;
  }

  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function scrollFeedToBottom() {
    feedEl.scrollTo({ top: feedEl.scrollHeight, behavior: 'smooth' });
  }

  function clearFeed() {
    while (feedEl.firstChild) feedEl.removeChild(feedEl.firstChild);
  }

  /* =======================================================================
     STARCARE HEALTH — labeled as an illustrative example everywhere it
     appears, via a small inline badge built with createElement.
     ======================================================================= */
  function starcareBadge() {
    return el('span', 'ml-1 align-middle whitespace-nowrap text-[8.5px] sm:text-[9px] uppercase tracking-wide text-textfaint border border-line rounded px-1 py-px font-mono', 'illustrative example');
  }
  function starcareName() {
    var frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode('StarCare Health'));
    frag.appendChild(starcareBadge());
    return frag;
  }

  /* =======================================================================
     FEED BUILDERS
     ======================================================================= */
  function addSceneDivider(num, title) {
    var wrap = el('div', 'flex items-center gap-3 max-w-lg mx-auto py-2 anim-in');
    var line1 = el('div', 'flex-1 h-px bg-line');
    var label = el('span', 'text-[10px] font-mono uppercase tracking-[0.1em] text-textfaint whitespace-nowrap',
      'Scene ' + num + ' \u00B7 ' + title);
    var line2 = el('div', 'flex-1 h-px bg-line');
    wrap.appendChild(line1); wrap.appendChild(label); wrap.appendChild(line2);
    feedEl.appendChild(wrap);
    scrollFeedToBottom();
  }

  function addNarrator(text) {
    var p = el('p', 'text-center italic text-textfaint text-sm max-w-xl mx-auto py-1 anim-in leading-relaxed');
    if (Array.isArray(text)) appendParts(p, text); else p.appendChild(document.createTextNode(text));
    feedEl.appendChild(p);
    scrollFeedToBottom();
  }

  function addOfficial(speakerLabel, text) {
    var wrap = el('div', 'text-center anim-in max-w-xl mx-auto py-1');
    var label = el('div', 'text-[10px] font-mono uppercase tracking-wide text-textfaint', speakerLabel);
    var p = el('p', 'italic text-textdim text-sm mt-1 leading-relaxed');
    if (Array.isArray(text)) appendParts(p, text); else p.appendChild(document.createTextNode(text));
    wrap.appendChild(label); wrap.appendChild(p);
    feedEl.appendChild(wrap);
    scrollFeedToBottom();
  }
  function addDoctor(text) { addOfficial('\uD83E\uDE7A Dr. Patel \u2014 City Medical Center', text); }
  function addFrontDesk(text) { addOfficial('\uD83D\uDCCB Front Desk \u2014 City Medical Center', text); }

  var AVATARS = { rahul: '\uD83D\uDC66', priya: '\uD83D\uDC67' };
  var NAMES = { rahul: 'Rahul', priya: 'Priya' };

  function buildBubbleRow(who) {
    var isLeft = who === 'rahul';
    var row = el('div', 'flex w-full items-end gap-2 anim-in ' + (isLeft ? 'justify-start' : 'justify-end'));
    var avatar = el('div', 'w-9 h-9 rounded-full flex items-center justify-center text-base shrink-0 bg-surface border border-line', AVATARS[who]);
    var bubbleWrap = el('div', 'flex flex-col max-w-[78%] sm:max-w-[70%] ' + (isLeft ? 'items-start' : 'items-end'));
    var nameTag = el('span', 'text-[10px] font-mono uppercase tracking-wide text-textfaint mb-1', NAMES[who]);
    bubbleWrap.appendChild(nameTag);
    if (isLeft) { row.appendChild(avatar); row.appendChild(bubbleWrap); }
    else { row.appendChild(bubbleWrap); row.appendChild(avatar); }
    return { row: row, bubbleWrap: bubbleWrap };
  }

  function addBubble(who, text) {
    var built = buildBubbleRow(who);
    var isLeft = who === 'rahul';
    var bubble = el('div', 'px-4 py-3 rounded-2xl text-sm leading-relaxed ' +
      (isLeft ? 'bg-surface border border-line rounded-bl-sm text-text'
              : 'bg-blue/10 border border-blue/30 rounded-br-sm text-text'));
    if (Array.isArray(text)) appendParts(bubble, text); else bubble.appendChild(document.createTextNode(text));
    built.bubbleWrap.appendChild(bubble);
    feedEl.appendChild(built.row);
    scrollFeedToBottom();
  }

  function showTyping(who) {
    var built = buildBubbleRow(who);
    var isLeft = who === 'rahul';
    var bubble = el('div', 'px-4 py-3 rounded-2xl flex items-center gap-1.5 ' +
      (isLeft ? 'bg-surface border border-line rounded-bl-sm' : 'bg-blue/10 border border-blue/30 rounded-br-sm'));
    [0, 0.15, 0.3].forEach(function (delay) {
      var dot = el('span', 'typing-dot w-1.5 h-1.5 rounded-full bg-textfaint inline-block');
      dot.style.animationDelay = delay + 's';
      bubble.appendChild(dot);
    });
    built.bubbleWrap.appendChild(bubble);
    feedEl.appendChild(built.row);
    scrollFeedToBottom();
    return built.row;
  }

  async function addBubbleWithTyping(who, text, delayMs) {
    var typingRow = showTyping(who);
    await wait(delayMs || 700);
    feedEl.removeChild(typingRow);
    addBubble(who, text);
  }

  function addCitation(sourceLabel, text) {
    var card = el('div', 'max-w-md mx-auto border border-line bg-surface rounded-xl px-4 py-3 text-center anim-in');
    var tag = el('div', 'text-[10px] font-mono uppercase tracking-wide text-purple mb-1.5', '\uD83D\uDCCC ' + sourceLabel);
    var p = el('p', 'text-xs text-textdim italic leading-relaxed', text);
    card.appendChild(tag); card.appendChild(p);
    feedEl.appendChild(card);
    scrollFeedToBottom();
  }

  function addChecklist(title, items) {
    var card = el('div', 'max-w-lg mx-auto border border-line bg-surface rounded-xl p-4 anim-in');
    var h = el('div', 'text-[10px] font-mono uppercase tracking-wide text-textfaint mb-3', title);
    card.appendChild(h);
    var list = el('div', 'space-y-3');
    items.forEach(function (it) {
      var row = el('div', 'flex gap-2.5 items-start');
      var dot = el('span', 'mt-1.5 w-1.5 h-1.5 rounded-full bg-blue shrink-0');
      var textWrap = el('div', '');
      var lbl = el('div', 'text-sm font-semibold text-text', it.label);
      var why = el('div', 'text-xs text-textdim mt-0.5 leading-relaxed', it.why);
      textWrap.appendChild(lbl); textWrap.appendChild(why);
      row.appendChild(dot); row.appendChild(textWrap);
      list.appendChild(row);
    });
    card.appendChild(list);
    feedEl.appendChild(card);
    scrollFeedToBottom();
  }

  function addFlowDiagram(steps) {
    var wrap = el('div', 'max-w-lg mx-auto anim-in flex items-stretch justify-center gap-2 py-2 flex-wrap');
    steps.forEach(function (s, i) {
      var box = el('div', 'flex-1 min-w-[100px] text-center border border-line bg-surface rounded-lg px-3 py-3 flex flex-col items-center justify-center gap-1');
      var title = el('div', 'text-xs font-semibold text-text', s.title);
      box.appendChild(title);
      if (s.sub) box.appendChild(el('div', 'text-[10px] text-textfaint', s.sub));
      if (s.badge) box.appendChild(starcareBadge());
      wrap.appendChild(box);
      if (i < steps.length - 1) wrap.appendChild(el('div', 'text-textfaint text-base self-center shrink-0', '\u2192'));
    });
    feedEl.appendChild(wrap);
    scrollFeedToBottom();
  }

  function addNotice(kind, title, lines) {
    var borderCls = kind === 'denied' ? 'border-red/40' : 'border-green/40';
    var textCls = kind === 'denied' ? 'text-red' : 'text-green';
    var card = el('div', 'max-w-lg mx-auto border-2 ' + borderCls + ' bg-surface rounded-xl p-5 anim-in text-center');
    card.appendChild(el('div', 'text-2xl mb-1', kind === 'denied' ? '\u2716' : '\u2705'));
    card.appendChild(el('div', 'font-display font-bold text-lg ' + textCls, title));
    lines.forEach(function (l) {
      var p = el('p', 'text-sm text-textdim mt-2 leading-relaxed');
      if (Array.isArray(l)) appendParts(p, l); else p.appendChild(document.createTextNode(l));
      card.appendChild(p);
    });
    feedEl.appendChild(card);
    scrollFeedToBottom();
  }

  function showChoices(promptText, options) {
    return new Promise(function (resolve) {
      var wrap = el('div', 'max-w-lg mx-auto anim-in pt-2');
      var prompt = el('div', 'text-center text-[11px] text-textfaint font-mono uppercase tracking-wide mb-2.5', promptText);
      var btnRow = el('div', 'flex flex-col sm:flex-row gap-2');
      options.forEach(function (opt) {
        var btn = el('button',
          'flex-1 text-center px-4 py-3 rounded-lg border border-line bg-surface text-sm text-text hover:border-blue hover:text-blue transition-colors duration-150',
          opt.label);
        btn.type = 'button';
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(btnRow.children, function (b) {
            b.disabled = true;
            b.classList.add('opacity-40', 'cursor-not-allowed');
            b.classList.remove('hover:border-blue', 'hover:text-blue');
          });
          btn.classList.remove('opacity-40');
          btn.classList.add('border-blue', 'text-blue');
          resolve(opt.key);
        });
        btnRow.appendChild(btn);
      });
      wrap.appendChild(prompt); wrap.appendChild(btnRow);
      feedEl.appendChild(wrap);
      scrollFeedToBottom();
    });
  }

  function showStartButton() {
    return new Promise(function (resolve) {
      var wrap = el('div', 'max-w-md mx-auto anim-in text-center py-6');
      wrap.appendChild(el('div', 'text-3xl mb-3', '\uD83D\uDCCB'));
      wrap.appendChild(el('p', 'text-sm text-textdim mb-4 leading-relaxed',
        'Rahul has a new diagnosis and a new prescription. What happens next depends on his insurance \u2014 and on Prior Authorization.'));
      var btn = el('button', 'px-6 py-3 rounded-full border border-blue text-blue text-sm font-semibold hover:bg-blue/10 transition-colors', '\u25B6 Begin the Story');
      btn.type = 'button';
      btn.addEventListener('click', function () {
        wrap.remove();
        resolve();
      });
      wrap.appendChild(btn);
      feedEl.appendChild(wrap);
      scrollFeedToBottom();
    });
  }

  function showRestartButton() {
    var wrap = el('div', 'max-w-md mx-auto anim-in text-center py-6');
    var btn = el('button', 'px-6 py-3 rounded-full border border-line text-textdim text-sm font-semibold hover:border-blue hover:text-blue transition-colors', '\uD83D\uDD01 Restart the Story');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      clearFeed();
      updateProgress(0, 'Start');
      startApp();
    });
    wrap.appendChild(btn);
    feedEl.appendChild(wrap);
    scrollFeedToBottom();
  }

  function updateProgress(sceneNum, title) {
    var pct = Math.round((sceneNum / 8) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = sceneNum === 0 ? 'Scene 0 of 8' : ('Scene ' + sceneNum + ' of 8 \u2014 ' + title);
    progressPct.textContent = pct + '%';
  }

  /* =======================================================================
     SCENE DEFINITIONS
     ======================================================================= */
  var SCENES = [

    // ---------------- SCENE 1 : Doctor Visit ----------------
    {
      title: 'Doctor Visit',
      run: async function () {
        addNarrator('Rahul has had stiff, swollen joints for weeks. Today he\u2019s at City Medical Center to find out why.');
        await wait(600);
        await addBubbleWithTyping('rahul', 'Dr. Patel, my hands and knees have been so stiff every morning. Some days I can barely make a fist.');
        await wait(500);
        addNarrator('Dr. Patel examines Rahul\u2019s joints and reviews his bloodwork.');
        await wait(700);
        addDoctor('Your bloodwork and symptoms point to Rheumatoid Arthritis \u2014 an autoimmune condition where the immune system attacks the joints. I\u2019d like to start you on Humira, a biologic medication that helps control the inflammation.');
        await wait(700);
        await addBubbleWithTyping('rahul', 'Okay\u2026 that\u2019s a lot to take in.');
        await wait(400);

        var choice = await showChoices('What does Rahul want to ask next?', [
          { label: 'How serious is Rheumatoid Arthritis?', key: 'serious' },
          { label: 'Will my insurance cover Humira?', key: 'insurance' }
        ]);

        if (choice === 'serious') {
          await wait(300);
          addDoctor('It\u2019s a chronic condition, so we\u2019ll manage it long-term. The good news is that starting treatment early, like with Humira, can help prevent lasting joint damage.');
        } else {
          await wait(300);
          addFrontDesk('Almost all biologic medications like Humira need approval from your insurance company first \u2014 it\u2019s called Prior Authorization. My office will start that process today.');
        }
        await wait(500);
        addNarrator('Either way, before Rahul can start Humira, City Medical Center needs sign-off from his insurance \u2014 a process called Prior Authorization.');
      }
    },

    // ---------------- SCENE 2 : Insurance Roadblock ----------------
    {
      title: 'Insurance Roadblock',
      run: async function () {
        addNarrator('City Medical Center\u2019s billing team gets to work on the Prior Authorization request.');
        await wait(600);
        addFlowDiagram([
          { title: 'Provider', sub: 'City Medical Center' },
          { title: 'PA Request' },
          { title: 'Payer', sub: 'StarCare Health', badge: true }
        ]);
        await wait(700);
        await addBubbleWithTyping('priya', [
          'Hi Rahul, I\u2019m Priya \u2014 I work in healthcare operations, helping cases like yours move through the system. Dr. Patel\u2019s office sent your Humira request straight to ',
          starcareName(),
          ', the insurer in this story. No pharmacy is involved at this stage \u2014 it\u2019s a direct conversation between your provider and your payer.'
        ]);
        await wait(700);
        await addBubbleWithTyping('priya', [
          'One more thing worth knowing: once a PA like this is approved, ',
          starcareName(),
          ' usually keeps it on file permanently. That means City Medical Center won\u2019t have to resubmit the whole request every time you refill Humira.'
        ]);
        await wait(500);
        await addBubbleWithTyping('rahul', 'Okay\u2026 so what happens now?');
        await wait(300);

        var choice = await showChoices('What does Rahul want to know?', [
          { label: 'Why does insurance need to approve this?', key: 'why' },
          { label: 'What happens while we wait?', key: 'wait' }
        ]);

        if (choice === 'why') {
          await wait(300);
          await addBubbleWithTyping('priya', 'Insurance companies want to confirm a treatment is medically necessary and appropriate before covering an expensive medication like Humira. It\u2019s their way of double-checking, not second-guessing your doctor.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'The review team checks your file against a few specific criteria \u2014 it usually takes a few days to a couple of weeks. Let\u2019s walk through what they\u2019re actually looking for.');
        }
        await wait(400);
        addNarrator('Priya pulls up the basics of how Prior Authorization works.');
      }
    },

    // ---------------- SCENE 3 : What is PA? ----------------
    {
      title: 'What is PA?',
      run: async function () {
        await addBubbleWithTyping('priya', 'Prior Authorization, or "PA," is basically your insurance company saying: "Before we pay for this, show us why it\u2019s needed." It\u2019s common for newer or costlier medications, like biologics.', 800);
        await wait(600);
        await addBubbleWithTyping('priya', 'It can feel like a hurdle, but it\u2019s not just bureaucracy. For a fast-moving diagnosis like Rheumatoid Arthritis, step therapy and review delays can give the disease more time to damage the joints \u2014 so timing genuinely matters here.');
        await wait(600);
        addCitation('AMA 2023 PA Survey', 'Prior authorization causes treatment delays in the majority of cases.');
        await wait(700);

        var choice = await showChoices('What does Rahul want explained?', [
          { label: 'What is "step therapy"?', key: 'step' },
          { label: 'Why do delays matter for RA specifically?', key: 'delay' }
        ]);

        if (choice === 'step') {
          await wait(300);
          await addBubbleWithTyping('priya', 'Step therapy means an insurer wants you to try a more established, usually cheaper treatment first, before approving a newer one. It\u2019s meant to control costs \u2014 but it can also slow things down if that path doesn\u2019t really fit the diagnosis.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'Rheumatoid Arthritis can damage joints permanently if it stays active too long. The earlier an effective treatment starts, the more damage it can prevent \u2014 that\u2019s exactly why a quick, complete PA review matters so much here.');
        }
      }
    },

    // ---------------- SCENE 4 : Insurance Review ----------------
    {
      title: 'Insurance Review',
      run: async function () {
        await addBubbleWithTyping('priya', [
          'Let\u2019s look at what ', starcareName(), ' actually checks before approving a request like Rahul\u2019s.'
        ]);
        await wait(600);
        addChecklist('What StarCare Health Reviews', [
          { label: 'Eligibility', why: 'Confirms Rahul is an active member with benefits that cover this type of medication.' },
          { label: 'Clinical Documentation', why: 'Checks that Dr. Patel\u2019s notes support the diagnosis and the reason Humira is being prescribed.' },
          { label: 'ICD-10 Diagnosis Match', why: 'ICD-10 is the coding system doctors use to record diagnoses. The code on file has to match Rheumatoid Arthritis.' },
          { label: 'Step Therapy History', why: 'Confirms whether Rahul already tried a lower-cost treatment first, if the plan requires it.' }
        ]);
        await wait(800);
        await addBubbleWithTyping('rahul', 'That\u2019s a lot of boxes to check. What if something\u2019s missing or off, even by a little?');
        await wait(300);

        var choice = await showChoices('What does Rahul ask?', [
          { label: 'What if there\u2019s a small mistake in the paperwork?', key: 'mistake' },
          { label: 'What exactly is ICD-10?', key: 'icd' }
        ]);

        if (choice === 'mistake') {
          await wait(300);
          await addBubbleWithTyping('priya', 'Even a small gap \u2014 like a missing note about a prior treatment \u2014 can be enough for the reviewer to pause the request. That\u2019s actually a really common reason PA requests get delayed or denied.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'ICD-10 is a standardized set of codes doctors use worldwide to record exactly what\u2019s being diagnosed and treated. It lets the insurer confirm, in plain data, that the treatment matches the diagnosis on file.');
        }
      }
    },

    // ---------------- SCENE 5 : Denial ----------------
    {
      title: 'Denial',
      run: async function () {
        addNarrator('Three weeks later, a letter arrives.');
        await wait(800);
        addNotice('denied', 'Prior Authorization Denied', [
          ['Payer: ', starcareName()],
          'Reason: Missing documentation of step therapy \u2014 there is no record on file that Rahul tried a prior conventional treatment before Humira.'
        ]);
        await wait(800);
        await addBubbleWithTyping('rahul', 'Denied?! Does that mean I can\u2019t get the medication at all?');
        await wait(500);
        await addBubbleWithTyping('priya', 'Take a breath \u2014 a denial is not the end of the road. Most denials like this one happen because of a documentation gap, not because the treatment itself was wrong. There\u2019s a clear next step: an appeal.');
        await wait(600);
        addCitation('Healthcare Operations Note', 'PA denials cost physician offices 2+ staff hours to resolve, on average.');
        await wait(700);

        var choice = await showChoices('What does Rahul want to know?', [
          { label: 'Whose fault is this \u2014 ours, or theirs?', key: 'fault' },
          { label: 'What do we do now?', key: 'now' }
        ]);

        if (choice === 'fault') {
          await wait(300);
          await addBubbleWithTyping('priya', 'Usually nobody\u2019s specifically at fault \u2014 it\u2019s a process gap. Maybe the step-therapy record existed but wasn\u2019t sent, or wasn\u2019t documented clearly enough. That\u2019s exactly the kind of thing an appeal can fix.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'We gather the missing documentation, add a letter from Dr. Patel explaining why Humira is necessary, and file a formal appeal. Let\u2019s walk through it.');
        }
      }
    },

    // ---------------- SCENE 6 : Appeal ----------------
    {
      title: 'Appeal',
      run: async function () {
        addNarrator('Dr. Patel\u2019s office starts gathering everything the appeal will need.');
        await wait(700);
        addDoctor('I\u2019m writing a Letter of Medical Necessity. It will lay out Rahul\u2019s diagnosis, the treatments already tried, and why Humira is the right next step for him specifically.');
        await wait(700);
        await addBubbleWithTyping('priya', [
          'That letter, plus the step therapy records and updated clinical notes, gets bundled into a formal appeal package and resubmitted to ',
          starcareName(),
          ' for a second review.'
        ]);
        await wait(600);
        addChecklist('Appeal Packet', [
          { label: 'Letter of Medical Necessity', why: 'Dr. Patel\u2019s written explanation of why Humira is medically necessary for Rahul.' },
          { label: 'Step Therapy Records', why: 'Documentation showing what treatment Rahul already tried before Humira.' },
          { label: 'Updated Clinical Notes', why: 'Confirms the diagnosis and treatment plan are current and complete.' }
        ]);
        await wait(800);

        var choice = await showChoices('What does Rahul ask?', [
          { label: 'How long does an appeal usually take?', key: 'time' },
          { label: 'Could this get denied again?', key: 'again' }
        ]);

        if (choice === 'time') {
          await wait(300);
          await addBubbleWithTyping('priya', 'It varies by plan, but a complete packet \u2014 like the one we\u2019re sending now \u2014 tends to move faster than the first request did.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'It\u2019s possible, but unlikely here. This appeal directly answers the exact reason StarCare Health gave for the denial, which gives it a strong chance of approval.');
        }
      }
    },

    // ---------------- SCENE 7 : Approval ----------------
    {
      title: 'Approval',
      run: async function () {
        addNarrator('Two weeks later, another letter arrives.');
        await wait(800);
        addNotice('approved', 'Prior Authorization Approved', [
          ['Payer: ', starcareName()],
          'Reference Number: PA-48213-RA',
          'This approval is saved on file \u2014 no repeat PA is needed for future Humira refills, as long as Rahul\u2019s treatment stays the same.'
        ]);
        await wait(800);
        await addBubbleWithTyping('rahul', 'Finally! So I don\u2019t have to go through all of this again next time?');
        await wait(500);
        await addBubbleWithTyping('priya', [
          'Exactly. That reference number stays on file with ',
          starcareName(),
          '. As long as nothing about the prescription changes, future refills can just point back to this approval.'
        ]);
        await wait(500);

        var choice = await showChoices('What does Rahul ask?', [
          { label: 'What would make me need a new PA later?', key: 'future' },
          { label: 'What did I just learn from all this?', key: 'learn' }
        ]);

        if (choice === 'future') {
          await wait(300);
          await addBubbleWithTyping('priya', 'Mainly two things: if your medication or dose changes, or if you switch insurance plans. Either of those would usually trigger a brand-new PA request.');
        } else {
          await wait(300);
          await addBubbleWithTyping('priya', 'A lot, actually. Let\u2019s take a step back and look at the whole journey \u2014 both from where you sat, and from where I sit.');
        }
        await wait(500);
        addNarrator('Rahul and Priya look back on the whole journey.');
      }
    },

    // ---------------- SCENE 8 : Takeaways ----------------
    {
      title: 'Takeaways',
      run: async function () {
        function renderPatient() {
          addChecklist('\uD83E\uDDD1 Patient Perspective \u2014 What Rahul Learned', [
            { label: 'PA is a check, not a rejection', why: 'It\u2019s the insurer confirming a treatment makes sense before paying for it \u2014 not a judgment on the doctor\u2019s decision.' },
            { label: 'Documentation has to be complete', why: 'A single missing record, like step therapy history, can be enough to cause a denial.' },
            { label: 'A denial isn\u2019t final', why: 'Most denials, including Rahul\u2019s, can be resolved through a well-documented appeal.' },
            { label: 'Approval sticks around', why: 'Once approved, the PA is saved on file \u2014 future refills don\u2019t need to start from scratch.' }
          ]);
        }
        function renderSystem() {
          addChecklist('\uD83C\uDFE5 System Perspective \u2014 How Health Systems Track This', [
            { label: 'Denial Rate', why: 'How often PA requests get denied on the first try \u2014 a high rate often points to documentation gaps.' },
            { label: 'Appeal Rate', why: 'How many denials get appealed, and how many of those appeals succeed.' },
            { label: 'Resolution Time', why: 'How long it takes from the first request to a final answer, including any appeal.' }
          ]);
        }

        var choice = await showChoices('Whose perspective should we look at first?', [
          { label: 'Rahul\u2019s perspective (Patient)', key: 'patient' },
          { label: 'Priya\u2019s perspective (System)', key: 'system' }
        ]);

        await wait(400);
        if (choice === 'patient') {
          renderPatient();
          await wait(900);
          renderSystem();
        } else {
          renderSystem();
          await wait(900);
          renderPatient();
        }

        await wait(800);
        addNarrator('Rahul\u2019s Humira is approved, on file, and ready \u2014 and somewhere else in the system, the next patient\u2019s story is just beginning.');
        await wait(600);
        showRestartButton();
      }
    }
  ];

  /* =======================================================================
     ENGINE
     ======================================================================= */
  async function runScene(index) {
    var scene = SCENES[index];
    updateProgress(index + 1, scene.title);
    addSceneDivider(index + 1, scene.title);
    await scene.run();
    if (index < SCENES.length - 1) {
      await wait(500);
      runScene(index + 1);
    }
  }

  async function startApp() {
    await showStartButton();
    runScene(0);
  }

  document.addEventListener('DOMContentLoaded', startApp);
})();
</script>
</body>
</html>
