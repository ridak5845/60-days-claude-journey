<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

  :root{
    --bg:#0a1410;
    --bg2:#0d1a14;
    --corkboard:#241a10;
    --corkboard2:#2c2013;
    --surface:#122019;
    --surface2:#16261e;
    --line:#26392f;
    --line-soft:#1b2921;
    --text:#eaf2ec;
    --text-dim:#9db3a5;
    --text-faint:#5f7669;
    --gold:#d4af37;
    --gold-bright:#f2ce5c;
    --emerald:#2fae76;
    --emerald-bright:#4ee39c;
    --red:#e2665c;
    --amber:#e3a544;
    --blue:#6ea8fe;
    --paper:#f3ecd8;
    --paper-text:#2b2418;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --hand:'Caveat', cursive;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, #12291d 0%, transparent 55%),
      radial-gradient(ellipse at 90% 80%, #17301f 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg2);}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .md-app{position:relative;min-height:100vh;}

  /* ===== Utility ===== */
  .md-hidden{display:none !important;}
  .md-btn{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    padding:13px 26px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:linear-gradient(180deg, rgba(212,175,55,.16), rgba(212,175,55,.05));
    color:var(--gold-bright);
    cursor:pointer;
    transition:all .2s ease;
    text-transform:uppercase;
  }
  .md-btn:hover{
    background:linear-gradient(180deg, rgba(212,175,55,.3), rgba(212,175,55,.12));
    box-shadow:0 0 22px rgba(212,175,55,.25);
    transform:translateY(-1px);
  }
  .md-btn:active{transform:translateY(0);}
  .md-btn.primary{
    border-color:var(--emerald-bright);
    background:linear-gradient(180deg, rgba(78,227,156,.22), rgba(78,227,156,.06));
    color:var(--emerald-bright);
  }
  .md-btn.primary:hover{
    box-shadow:0 0 24px rgba(78,227,156,.3);
  }
  .md-btn.ghost{
    border-color:var(--line);
    background:transparent;
    color:var(--text-dim);
  }
  .md-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}

  .md-mono{font-family:var(--mono);}
  .md-eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
  }

  /* ===== Screens ===== */
  .md-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 70px;
    animation:mdFadeIn .5s ease;
  }
  @keyframes mdFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ===== Title / intro screen ===== */
  .md-intro{max-width:640px;text-align:center;margin-top:8vh;}
  .md-badge-icon{
    width:86px;height:86px;margin:0 auto 26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--gold);
    background:radial-gradient(circle at 40% 30%, rgba(212,175,55,.25), rgba(212,175,55,.02));
    box-shadow:0 0 40px rgba(212,175,55,.18);
    font-size:38px;
  }
  .md-title{
    font-family:var(--display);
    font-size:42px;
    font-weight:700;
    margin:0 0 12px;
    letter-spacing:-0.01em;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .md-tagline{color:var(--text-dim);font-size:15.5px;margin:0 0 34px;line-height:1.6;}
  .md-file-stack{position:relative;height:64px;margin-bottom:30px;}
  .md-file-stack .md-folder{
    position:absolute;left:50%;top:0;
    width:150px;height:56px;
    background:linear-gradient(180deg,#3a2c17,#2c210f);
    border:1px solid var(--gold);
    border-radius:6px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .md-file-stack .md-folder:nth-child(1){transform:translateX(-50%) rotate(-7deg);}
  .md-file-stack .md-folder:nth-child(2){transform:translateX(-50%) rotate(4deg);}
  .md-file-stack .md-folder:nth-child(3){transform:translateX(-50%) rotate(-2deg);}

  /* ===== Case assignment card ===== */
  .md-case-card{
    max-width:560px;width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:26px 28px;
    margin:26px 0 32px;
    position:relative;
    box-shadow:0 20px 44px rgba(0,0,0,.4);
  }
  .md-stamp{
    position:absolute;top:14px;right:16px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.08em;
    color:var(--emerald-bright);
    border:1.5px solid var(--emerald-bright);
    border-radius:4px;
    padding:3px 8px;
    transform:rotate(6deg);
    opacity:.85;
  }
  .md-case-company{font-family:var(--display);font-size:21px;font-weight:600;margin:6px 0 4px;}
  .md-case-industry{color:var(--text-faint);font-size:12.5px;margin-bottom:16px;}
  .md-case-brief{font-size:13.5px;color:var(--text-dim);line-height:1.7;}

  /* ===== Progress ===== */
  .md-progress-wrap{
    width:100%;max-width:960px;
    display:flex;align-items:center;gap:8px;
    margin-bottom:26px;
    padding:0 4px;
  }
  .md-progress-step{
    flex:1;height:5px;border-radius:3px;
    background:var(--line);
    position:relative;overflow:hidden;
  }
  .md-progress-step.done{background:var(--emerald);}
  .md-progress-step.active::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    animation:mdShimmer 1.4s infinite;
  }
  @keyframes mdShimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .md-progress-label{
    font-family:var(--mono);font-size:10px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.06em;
    text-align:center;margin-bottom:10px;
  }

  /* ===== Corkboard ===== */
  .md-corkboard{
    width:100%;max-width:1080px;
    background:
      radial-gradient(circle at 10% 10%, rgba(0,0,0,.25), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,.25), transparent 40%),
      repeating-radial-gradient(circle at center, #2c2013 0px, #291d11 2px, #251b0f 3px);
    background-color:var(--corkboard);
    border:10px solid #1a130a;
    border-radius:10px;
    padding:28px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 20px 50px rgba(0,0,0,.5);
    position:relative;
  }
  .md-corkboard-title{
    font-family:var(--hand);
    font-size:30px;
    color:var(--gold-bright);
    text-align:center;
    margin:-4px 0 20px;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }

  .md-board-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:22px;
  }

  /* sticky notes / evidence cards */
  .md-note{
    background:var(--paper);
    color:var(--paper-text);
    border-radius:2px;
    padding:16px 16px 14px;
    box-shadow:0 10px 18px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.05);
    position:relative;
    font-size:13px;
    line-height:1.55;
    transform:rotate(var(--tilt,-1deg));
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:grab;
  }
  .md-note:hover{transform:rotate(0deg) scale(1.025);box-shadow:0 16px 26px rgba(0,0,0,.55);}
  .md-note.dragging{cursor:grabbing;opacity:.85;z-index:50;}
  .md-note.yellow{background:#f3e6a6;}
  .md-note.green{background:#cfe8cf;}
  .md-note.pink{background:#f3d3cf;}
  .md-note.blue{background:#cfe1ef;}
  .md-pin{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a7a, #b3261e);
    box-shadow:0 3px 5px rgba(0,0,0,.5);
  }
  .md-note-label{
    font-family:var(--mono);
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#6b5f3a;
    margin-bottom:6px;
    display:block;
  }
  .md-note-title{font-family:var(--display);font-weight:700;font-size:14px;margin-bottom:6px;}
  .md-note ul{margin:6px 0 0;padding-left:16px;}
  .md-note li{margin-bottom:3px;}

  /* metric mini bars inside notes */
  .md-metric-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;margin-bottom:5px;}
  .md-metric-row span:last-child{font-weight:700;}

  /* string connecting board sections */
  .md-section-label{
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--gold);
    margin:26px 0 12px;
    display:flex;align-items:center;gap:10px;
  }
  .md-section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, var(--gold), transparent);opacity:.4;}

  /* ===== Investigation drag zone ===== */
  .md-investigate-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    width:100%;
    max-width:1080px;
    margin-top:22px;
  }
  @media (max-width:820px){ .md-investigate-layout{grid-template-columns:1fr;} }

  .md-evidence-pool{
    background:var(--corkboard2);
    border:10px solid #1a130a;
    border-radius:10px;
    padding:20px;
    min-height:420px;
  }
  .md-dropzone{
    background:var(--surface);
    border:2px dashed var(--line);
    border-radius:12px;
    padding:20px;
    min-height:420px;
    transition:border-color .2s, background .2s;
  }
  .md-dropzone.over{border-color:var(--emerald-bright);background:var(--surface2);}
  .md-dropzone-title{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:14px;}
  .md-dropzone-hint{font-size:12px;color:var(--text-faint);text-align:center;margin-top:40px;}
  .md-dropped-list{display:flex;flex-direction:column;gap:12px;}

  .md-evidence-pool .md-board-grid{grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:520px){.md-evidence-pool .md-board-grid{grid-template-columns:1fr;}}

  /* ===== Solve panel ===== */
  .md-solve-wrap{width:100%;max-width:760px;margin-top:10px;}
  .md-solve-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
    box-shadow:0 20px 44px rgba(0,0,0,.4);
  }
  .md-solve-q{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 6px;}
  .md-solve-sub{color:var(--text-faint);font-size:13px;margin:0 0 22px;}
  .md-option{
    display:flex;gap:14px;align-items:flex-start;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    cursor:pointer;
    transition:all .15s ease;
    background:var(--surface2);
  }
  .md-option:hover{border-color:var(--gold);background:#182a20;}
  .md-option.selected{border-color:var(--emerald-bright);background:rgba(78,227,156,.08);}
  .md-option.correct{border-color:var(--emerald-bright);background:rgba(78,227,156,.14);box-shadow:0 0 20px rgba(78,227,156,.15);}
  .md-option.incorrect{border-color:var(--red);background:rgba(226,102,92,.1);}
  .md-option-letter{
    font-family:var(--mono);font-weight:700;font-size:13px;
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--line);color:var(--text-dim);flex-shrink:0;
  }
  .md-option.selected .md-option-letter{background:var(--emerald-bright);color:#08130d;}
  .md-option-text{font-size:14px;line-height:1.5;}

  /* ===== Case closed animation ===== */
  .md-closed-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70vh;text-align:center;
  }
  .md-stamp-big{
    font-family:var(--display);
    font-weight:700;
    font-size:56px;
    letter-spacing:.05em;
    color:var(--red);
    border:6px solid var(--red);
    border-radius:12px;
    padding:10px 30px;
    transform:rotate(-8deg) scale(0);
    text-transform:uppercase;
    animation:mdStampIn .5s cubic-bezier(.2,1.4,.4,1) forwards .2s;
    opacity:0;
    box-shadow:0 0 40px rgba(226,102,92,.25);
  }
  @keyframes mdStampIn{
    0%{transform:rotate(-8deg) scale(2.6);opacity:0;}
    60%{opacity:1;}
    100%{transform:rotate(-8deg) scale(1);opacity:1;}
  }
  .md-closed-score{
    margin-top:30px;
    font-family:var(--mono);
    color:var(--text-dim);
    font-size:14px;
    opacity:0;
    animation:mdFadeUp .6s ease forwards 1s;
  }
  @keyframes mdFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ===== Learning report ===== */
  .md-report-wrap{width:100%;max-width:820px;}
  .md-report-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px;
    margin-bottom:20px;
  }
  .md-report-title{font-family:var(--display);font-size:16px;font-weight:600;color:var(--gold-bright);margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;}
  .md-report-text{font-size:14px;line-height:1.75;color:var(--text);}
  .md-improve-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .md-improve-item{display:flex;gap:12px;font-size:13.5px;line-height:1.6;}
  .md-improve-num{
    font-family:var(--mono);font-weight:700;color:var(--emerald-bright);
    flex-shrink:0;
  }
  .md-clue-recap{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .md-clue-recap div{font-size:13px;color:var(--text-dim);padding-left:16px;position:relative;}
  .md-clue-recap div::before{content:'—';position:absolute;left:0;color:var(--gold);}

  .md-final-actions{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap;}

  .md-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface2);border:1px solid var(--gold);
    color:var(--gold-bright);
    font-family:var(--mono);font-size:12.5px;
    padding:10px 18px;border-radius:8px;
    box-shadow:0 10px 24px rgba(0,0,0,.5);
    z-index:200;
    animation:mdToastIn .3s ease, mdToastOut .3s ease 2.2s forwards;
  }
  @keyframes mdToastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes mdToastOut{to{opacity:0;transform:translate(-50%,10px);}}

  .md-topbar{
    width:100%;max-width:1080px;
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:6px;
  }
  .md-case-id{font-family:var(--mono);font-size:11px;color:var(--text-faint);}

  .md-chart-bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px;}
  .md-chart-bar{flex:1;background:linear-gradient(180deg,var(--emerald-bright),var(--emerald));border-radius:4px 4px 0 0;position:relative;min-height:4px;transition:height 1s cubic-bezier(.2,.8,.3,1);}
  .md-chart-bar span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text-dim);}
  .md-chart-labels{display:flex;gap:10px;margin-top:6px;}
  .md-chart-labels div{flex:1;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================
   MARKETING DETECTIVE — CASE FILES
   ========================================================= */
const CASES = [
{
  company:"Lumen & Loom", industry:"Home Décor / E-commerce",
  objective:"Drive Q4 online sales for a new candle & textile line",
  audience:"Women 28–45, urban, mid-to-high income, home aesthetics enthusiasts",
  channels:["Instagram Ads","Pinterest","Email","Influencer Seeding"],
  budget:[{label:"Instagram Ads",pct:45},{label:"Influencers",pct:30},{label:"Pinterest",pct:15},{label:"Email",pct:10}],
  metrics:{reach:"1.2M",ctr:"0.4%",engagement:"8.9%",conversions:"0.3%",sales:"$14,200"},
  comments:["\"Loved the photos but the site took forever to load on my phone.\"","\"Added to cart, gave up checking out.\"","\"Are these even in stock? Says loading forever.\""],
  social:"High likes and saves on Instagram (8.9% engagement) but almost no link clicks converting to purchases; comments repeatedly mention slow mobile load times.",
  primaryMistake:"The mobile checkout and product pages load too slowly, causing high engagement to die at the final purchase step.",
  clues:[
    "CTR is decent for the ad creative, but conversion rate is far below industry average despite high engagement.",
    "Customer comments cluster around site speed and cart abandonment, not price or product interest.",
    "Budget is concentrated in awareness channels (ads, influencers) with none allocated to site/technical optimization."
  ],
  explanation:"The team over-invested in top-of-funnel awareness (ads + influencers = 75% of budget) while ignoring a broken bottom-of-funnel experience. High engagement proves the creative and targeting worked — the leak is a slow, likely unoptimized mobile checkout that causes drop-off exactly where comments say it happens.",
  improvements:[
    "Audit and optimize mobile page load speed and checkout flow before scaling ad spend further.",
    "Reallocate 10–15% of ad budget to technical/UX fixes (compression, fewer checkout steps, guest checkout).",
    "Add real-time stock/loading indicators so customers aren't left uncertain during checkout."
  ]
},
{
  company:"PulseFit Gear", industry:"Fitness Apparel",
  objective:"Launch a new performance leggings line nationally",
  audience:"Adults 18–34, fitness-focused, active on TikTok/Instagram",
  channels:["TikTok Ads","Instagram Reels","Affiliate Program","Paid Search"],
  budget:[{label:"TikTok Ads",pct:50},{label:"Reels",pct:20},{label:"Affiliates",pct:20},{label:"Paid Search",pct:10}],
  metrics:{reach:"3.4M",ctr:"1.9%",engagement:"11.2%",conversions:"1.1%",sales:"$61,000"},
  comments:["\"Size chart is confusing, ordered a medium and it's tiny.\"","\"Returned mine, ran two sizes small.\"","\"Cute but sizing is way off from other brands.\""],
  social:"Viral reach and strong CTR, but return rate is unusually high (31%) concentrated on the leggings SKU specifically.",
  primaryMistake:"An inaccurate or unclear size chart is driving a high volume of wrong-size purchases and returns, eroding the margin on an otherwise successful campaign.",
  clues:[
    "Return rate (31%) is nearly triple the category average despite strong sales volume.",
    "Comments overwhelmingly cite sizing issues rather than product quality or price complaints.",
    "The campaign never budgeted for a sizing guide, fit-quiz, or size-inclusive creative testing."
  ],
  explanation:"The marketing funnel itself performed well — reach, CTR, and engagement were all strong. The mistake sits downstream at the product information layer: a size chart mismatch is causing returns that will eventually show up as poor ROAS once refunds are processed, even though the campaign 'looks' successful on the surface metrics.",
  improvements:[
    "Publish a corrected, brand-specific size chart with model measurements and fit notes.",
    "Add a short fit-quiz or size-comparison tool to the product page.",
    "Feature real customer photos across body types in ads to set sizing expectations upfront."
  ]
},
{
  company:"BrightLeaf Tea Co.", industry:"Food & Beverage / CPG",
  objective:"Grow subscription sign-ups for a new herbal tea box",
  audience:"Adults 25–55 interested in wellness and self-care",
  channels:["Facebook Ads","Email Nurture","Podcast Sponsorships","Referral Program"],
  budget:[{label:"Facebook Ads",pct:35},{label:"Podcast Sponsorships",pct:35},{label:"Email",pct:20},{label:"Referral",pct:10}],
  metrics:{reach:"890K",ctr:"1.1%",engagement:"5.4%",conversions:"2.8%",sales:"$22,500 MRR"},
  comments:["\"Great first box, but I completely forgot to cancel before the trial ended and got charged.\"","\"Wish it was clearer this was a subscription, not one-time.\"","\"Cancelling was confusing, took 3 emails.\""],
  social:"Podcast-driven traffic converts well initially, but churn after month one is unusually high, and support tickets mention confusion around billing.",
  primaryMistake:"Subscription terms and the trial-to-paid transition are not communicated clearly at checkout, causing surprise charges and rapid churn once customers realize it's recurring billing.",
  clues:[
    "Conversion rate (2.8%) looks strong, but the case data shows churn spikes right after the first billing cycle.",
    "Multiple comments explicitly mention confusion about the subscription nature and cancellation difficulty.",
    "No budget line exists for onboarding emails that clarify billing timelines."
  ],
  explanation:"The acquisition side of the funnel is working — podcast sponsorships and referrals are pulling in real conversions. The failure is in post-purchase communication: customers don't understand they've joined a recurring subscription, so they churn or dispute charges the moment they're billed again, undermining long-term subscription revenue.",
  improvements:[
    "Add a clear reminder email 3 days before the trial converts to a paid subscription.",
    "State billing terms explicitly and prominently at checkout, not just in fine print.",
    "Simplify the cancellation flow to a single self-serve step to reduce support burden and complaints."
  ]
},
{
  company:"Northwind Outdoors", industry:"Outdoor Gear & Apparel",

/* small helpers */
function pctColor(v){
  if(v>=40) return 'var(--emerald-bright)';
  if(v>=20) return 'var(--gold)';
  return 'var(--text-dim)';
}
function randomCase(excludeIdx){
  let idx;
  do{ idx = Math.floor(Math.random()*CASES.length); } while(CASES.length>1 && idx===excludeIdx);
  return idx;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildOptions(kase){
  // wrong options pulled from other cases' primaryMistake, shuffled
  const others = CASES.filter(c=>c!==kase).map(c=>c.primaryMistake);
  const wrong = shuffle(others).slice(0,3);
  const options = shuffle([kase.primaryMistake, ...wrong]);
  return options;
}

/* =========================================================
   APP STATE MACHINE (vanilla JS, no framework)
   ========================================================= */
const root = document.getElementById('root');
let STATE = {
  screen:'intro', // intro | assign | board | investigate | solve | closed | report
  caseIdx:null,
  evidenceFound:[], // ids collected on board
  droppedEvidence:[], // ids dropped into case-file zone during investigate
  options:[],
  selectedOption:null,
  answered:false,
  correct:false
};

function setState(patch){
  STATE = {...STATE, ...patch};
  render();
}

function toast(msg){
  const t = document.createElement('div');
  t.className='md-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function progressBar(stepIndex){
  const steps = ['Assignment','Board','Investigation','Solve','Report'];
  let html = `<div class="md-progress-label">Case Progress — ${steps[stepIndex]}</div><div class="md-progress-wrap">`;
  steps.forEach((s,i)=>{
    let cls='md-progress-step';
    if(i<stepIndex) cls+=' done';
    if(i===stepIndex) cls+=' active';
    html += `<div class="${cls}"></div>`;
  });
  html += `</div>`;
  return html;
}

/* =========================================================
   RENDER FUNCTIONS
   ========================================================= */
function render(){
  root.innerHTML = '';
  const screen = document.createElement('div');
  screen.className='md-screen';

  if(STATE.screen==='intro') screen.innerHTML = renderIntro();
  else if(STATE.screen==='assign') screen.innerHTML = renderAssign();
  else if(STATE.screen==='board') screen.innerHTML = renderBoard();
  else if(STATE.screen==='investigate') screen.innerHTML = renderInvestigate();
  else if(STATE.screen==='solve') screen.innerHTML = renderSolve();
  else if(STATE.screen==='closed') screen.innerHTML = renderClosed();
  else if(STATE.screen==='report') screen.innerHTML = renderReport();

  root.appendChild(screen);
  attachHandlers();
}

  const kase = CASES[STATE.caseIdx];
  const items = getEvidenceItems(kase);
  return `
  <div class="md-topbar">
    <div class="md-case-id">CASE #${String(STATE.caseIdx+1).padStart(3,'0')} — ${kase.company}</div>
    <div class="md-case-id">${kase.industry}</div>
  </div>
  ${progressBar(1)}
  <div class="md-corkboard">
    <div class="md-corkboard-title">The Evidence Board</div>
    <div class="md-board-grid">
      ${items.map(it=>`
        <div class="md-note ${it.color}" style="--tilt:${it.tilt}deg">
          <div class="md-pin"></div>
          ${it.html}
        </div>
      `).join('')}
    </div>
  </div>
  <div style="margin-top:26px;">
    <button class="md-btn primary" id="md-to-investigate-btn">Begin Investigation →</button>
  </div>
  `;
}

function renderInvestigate(){
  const kase = CASES[STATE.caseIdx];
  const allItems = getEvidenceItems(kase);
  const pool = allItems.filter(it=>!STATE.droppedEvidence.includes(it.id));
  const dropped = allItems.filter(it=>STATE.droppedEvidence.includes(it.id));

  return `
  <div class="md-topbar">
    <div class="md-case-id">CASE #${String(STATE.caseIdx+1).padStart(3,'0')} — ${kase.company}</div>
    <div class="md-case-id">Drag evidence into the case file</div>
  </div>
  ${progressBar(2)}
  <div class="md-investigate-layout">
    <div class="md-evidence-pool">
      <div class="md-dropzone-title">Evidence Pool</div>
      <div class="md-board-grid">
        ${pool.map(it=>`
          <div class="md-note ${it.color}" style="--tilt:${it.tilt}deg" draggable="true" data-id="${it.id}">
            <div class="md-pin"></div>
            ${it.html}
          </div>
        `).join('') || '<div class="md-dropzone-hint">All evidence has been filed.</div>'}
      </div>
    </div>
    <div class="md-dropzone" id="md-dropzone">
      <div class="md-dropzone-title">Case File (${dropped.length}/${allItems.length})</div>
      <div class="md-dropped-list">
        ${dropped.map(it=>`
          <div class="md-note ${it.color}" style="--tilt:0deg;cursor:default;">
            <div class="md-pin"></div>
            ${it.html}
          </div>
        `).join('')}
      </div>
      ${dropped.length===0 ? '<div class="md-dropzone-hint">Drag sticky notes here to build your case file →</div>' : ''}
    </div>
  </div>
  <div style="margin-top:26px;display:flex;gap:12px;">
    <button class="md-btn ghost" id="md-file-all-btn">File All Evidence</button>
    <button class="md-btn primary" id="md-to-solve-btn" ${dropped.length<allItems.length ? 'disabled' : ''}>Ready to Solve →</button>
  </div>
  `;
}

function renderSolve(){
  const kase = CASES[STATE.caseIdx];
  return `
  <div class="md-topbar">
    <div class="md-case-id">CASE #${String(STATE.caseIdx+1).padStart(3,'0')} — ${kase.company}</div>
  </div>
  ${progressBar(3)}
  <div class="md-solve-wrap">
    <div class="md-solve-card">
      <h2 class="md-solve-q">What was the primary marketing mistake?</h2>
      <p class="md-solve-sub">Review the evidence you filed, then choose the explanation that best fits every clue.</p>
      ${STATE.options.map((opt,i)=>{
        let cls='md-option';
        if(STATE.answered){
          if(opt===kase.primaryMistake) cls+=' correct';
          else if(opt===STATE.selectedOption) cls+=' incorrect';
        } else if(opt===STATE.selectedOption){
          cls+=' selected';
        }
        return `
        <div class="${cls}" data-opt-idx="${i}">
          <div class="md-option-letter">${String.fromCharCode(65+i)}</div>
          <div class="md-option-text">${opt}</div>
        </div>`;
      }).join('')}
      <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:12px;">
        ${!STATE.answered ? `<button class="md-btn primary" id="md-submit-btn" ${STATE.selectedOption===null?'disabled':''}>Submit Verdict</button>`
        : `<button class="md-btn primary" id="md-close-case-btn">Close the Case →</button>`}
      </div>
    </div>
  </div>
  `;
}

function renderClosed(){
  const kase = CASES[STATE.caseIdx];
  return `
  <div class="md-closed-wrap">
    <div class="md-stamp-big">Case Closed</div>
    <div class="md-closed-score">
      ${STATE.correct ? `Verdict correct — ${kase.company}'s mistake identified.` : `Verdict logged — the actual cause is revealed in your report.`}
    </div>
    <button class="md-btn primary" id="md-to-report-btn" style="margin-top:36px;">View Learning Report →</button>
  </div>
  `;
}

function renderReport(){
  const kase = CASES[STATE.caseIdx];
  const metricVals = [
    {l:'CTR', v: parseFloat(kase.metrics.ctr)||0},
    {l:'Engage', v: parseFloat(kase.metrics.engagement)||0},
    {l:'Convert', v: parseFloat(kase.metrics.conversions)||0}
  ];
  const maxV = Math.max(...metricVals.map(m=>m.v), 1);
  return `
  <div class="md-topbar">
    <div class="md-case-id">CASE #${String(STATE.caseIdx+1).padStart(3,'0')} — ${kase.company}</div>
    <div class="md-case-id">${STATE.correct ? 'VERDICT: CORRECT' : 'VERDICT: REVIEWED'}</div>
  </div>
  ${progressBar(4)}
  <div class="md-report-wrap">
    <div class="md-report-card">
      <div class="md-report-title">The Real Story</div>
      <p class="md-report-text">${kase.explanation}</p>
    </div>
    <div class="md-report-card">
      <div class="md-report-title">Key Metrics at a Glance</div>
      <div class="md-chart-bars">
        ${metricVals.map(m=>`<div class="md-chart-bar" style="height:${(m.v/maxV*100)}px;"><span>${m.v}%</span></div>`).join('')}
      </div>
      <div class="md-chart-labels">${metricVals.map(m=>`<div>${m.l}</div>`).join('')}</div>
    </div>
    <div class="md-report-card">
      <div class="md-report-title">Clues Revisited</div>
      <div class="md-clue-recap">${kase.clues.map(c=>`<div>${c}</div>`).join('')}</div>
    </div>
    <div class="md-report-card">
      <div class="md-report-title">Suggested Improvements</div>
      <div class="md-improve-list">
        ${kase.improvements.map((imp,i)=>`<div class="md-improve-item"><span class="md-improve-num">${i+1}.</span><span>${imp}</span></div>`).join('')}
      </div>
    </div>
    <div class="md-final-actions">
      <button class="md-btn primary" id="md-new-case-btn">Take Another Case</button>
      <button class="md-btn ghost" id="md-restart-btn">Return to Agency HQ</button>
    </div>
  </div>
  `;
}

/* =========================================================
   HANDLERS
   ========================================================= */
function attachHandlers(){
  const startBtn = document.getElementById('md-start-btn');
  if(startBtn) startBtn.onclick = ()=>{
    const idx = randomCase(STATE.caseIdx);
    setState({screen:'assign', caseIdx:idx, droppedEvidence:[], options:[], selectedOption:null, answered:false, correct:false});
  };

  const toBoard = document.getElementById('md-to-board-btn');
  if(toBoard) toBoard.onclick = ()=> setState({screen:'board'});

  const toInvestigate = document.getElementById('md-to-investigate-btn');
  if(toInvestigate) toInvestigate.onclick = ()=> setState({screen:'investigate'});

  const fileAllBtn = document.getElementById('md-file-all-btn');
  if(fileAllBtn) fileAllBtn.onclick = ()=>{
    const kase = CASES[STATE.caseIdx];
    const allIds = getEvidenceItems(kase).map(it=>it.id);
    setState({droppedEvidence:allIds});
    toast('All evidence filed.');
  };

  const toSolve = document.getElementById('md-to-solve-btn');
  if(toSolve) toSolve.onclick = ()=>{
    const kase = CASES[STATE.caseIdx];
    setState({screen:'solve', options: buildOptions(kase)});
  };

  // drag & drop
  const dropzone = document.getElementById('md-dropzone');
  document.querySelectorAll('.md-evidence-pool .md-note[draggable="true"]').forEach(note=>{
    note.addEventListener('dragstart', (e)=>{
      note.classList.add('dragging');
      e.dataTransfer.setData('text/plain', note.getAttribute('data-id'));
    });
    note.addEventListener('dragend', ()=> note.classList.remove('dragging'));
    // simple click-to-file fallback for touch devices
    note.addEventListener('click', ()=>{
      const id = note.getAttribute('data-id');
      if(!STATE.droppedEvidence.includes(id)){
        setState({droppedEvidence:[...STATE.droppedEvidence, id]});
        toast('Evidence filed.');
      }
    });
  });
  if(dropzone){
    dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', (e)=>{
      e.preventDefault();
      dropzone.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      if(id && !STATE.droppedEvidence.includes(id)){
        setState({droppedEvidence:[...STATE.droppedEvidence, id]});
        toast('Evidence filed.');
      }
    });
  }

  // solve options
  document.querySelectorAll('.md-option').forEach(optEl=>{
    optEl.onclick = ()=>{
      if(STATE.answered) return;
      const idx = parseInt(optEl.getAttribute('data-opt-idx'),10);
      setState({selectedOption: STATE.options[idx]});
    };
  });

  const submitBtn = document.getElementById('md-submit-btn');
  if(submitBtn) submitBtn.onclick = ()=>{
    const kase = CASES[STATE.caseIdx];
    setState({answered:true, correct: STATE.selectedOption===kase.primaryMistake});
  };

  const closeCaseBtn = document.getElementById('md-close-case-btn');
  if(closeCaseBtn) closeCaseBtn.onclick = ()=> setState({screen:'closed'});

  const toReportBtn = document.getElementById('md-to-report-btn');
  if(toReportBtn) toReportBtn.onclick = ()=> setState({screen:'report'});

  const newCaseBtn = document.getElementById('md-new-case-btn');
  if(newCaseBtn) newCaseBtn.onclick = ()=>{
    const idx = randomCase(STATE.caseIdx);
    setState({screen:'assign', caseIdx:idx, droppedEvidence:[], options:[], selectedOption:null, answered:false, correct:false});
  };

  const restartBtn = document.getElementById('md-restart-btn');
  if(restartBtn) restartBtn.onclick = ()=> setState({screen:'intro', caseIdx:null, droppedEvidence:[], options:[], selectedOption:null, answered:false, correct:false});
}

render();
</script>
</body>
</html>
